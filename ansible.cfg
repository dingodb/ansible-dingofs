[defaults]
inventory = inventory/hosts.yml
roles_path = roles
remote_user = dingofs
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=3
