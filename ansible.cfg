[defaults]
inventory = inventory/hosts.yml
roles_path = roles
library = library
filter_plugins = filter_plugins
remote_user = dingofs
host_key_checking = True
retry_files_enabled = False
# YAML-formatted task output. This used to be `stdout_callback = yaml`, but that
# plugin ships in community.general and was removed in community.general 12.0.0;
# with a newer collection installed, ansible-playbook aborts at startup with
# "The 'community.general.yaml' callback plugin has been removed". Note that
# --syntax-check does not load callback plugins, so it cannot catch this.
# The ansible-core 2.13+ equivalent is the default callback plus this option
# (the key is callback_result_format, not result_format).
# Uses default output for ordinary plays and a compact summary for client discovery.
stdout_callback = dingofs
callback_result_format = yaml
# Write per-run client restart/skip reports on the controller.
callback_plugins = callback_plugins
callbacks_enabled = dingofs_client_report
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ServerAliveInterval=15 -o ServerAliveCountMax=3
