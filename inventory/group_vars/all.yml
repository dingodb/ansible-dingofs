---
# ============================================================
# DingoFS Ansible - Global Variables
# ============================================================

# --- User & Access ---
dingofs_user: dingofs
dingofs_password: dingofsPassword
dingofs_home: /home/dingofs
dingofs_pkg_dir: /home/dingofs/pkg
dingofs_script_dir: /home/dingofs/script

# --- SSH ---
dingofs_ssh_key_type: rsa
dingofs_ssh_key_bits: 4096
ansible_python_interpreter: /usr/bin/python3

# --- Package URLs (offline: set to local paths; online: set to URLs) ---
rqlite_use_local_pkg: false
rqlite_version: "v9.4.5"
rqlite_tarball: "rqlite-{{ rqlite_version }}-linux-amd64.tar.gz"
rqlite_download_url: "https://github.com/rqlite/rqlite/releases/download/{{ rqlite_version }}/{{ rqlite_tarball }}"
rqlite_local_src: "/root/dingofs/pkg/{{ rqlite_tarball }}"

dingo_cli_download_url: "https://www.dingodb.com/dingocli/branches/main/latest/dingo"

# --- RQLite ---
rqlite_http_port: 4001
rqlite_raft_port: 4002
rqlite_node_dir: ~/rqlite/node
rqlite_master_host: "{{ hostvars[groups['rqlite_master'][0]]['ansible_host'] }}"

# --- Dingo CLI ---
dingo_cli_log_level: error
dingo_cli_timeout: 300
dingo_cli_auto_upgrade: false
dingo_cli_engine: podman
dingo_cli_ssh_retries: 3
dingo_cli_ssh_timeout: 10
dingo_cli_db_url: "rqlite://{{ rqlite_master_host }}:{{ rqlite_http_port }}"

# --- Container Engine ---
container_engine: podman

# --- DingoFS Cluster ---
dingofs_cluster_name: v5.1
dingofs_cluster_id: 1
dingofs_container_image: "harbor.zetyun.cn/dingofs/dingofs:v5.1-b484ef2"
dingofs_store_image: "harbor.zetyun.cn/dingodb/dingo-store:90b2885"
dingofs_executor_image: "harbor.zetyun.cn/dingodb/dingo:develop-latest"

dingofs_data_dir: "/mnt/data${service_replica_sequence}/dingofs-v5.1/data/${service_role}"
dingofs_log_dir: "/mnt/data${service_replica_sequence}/dingofs-v5.1/logs/${service_role}"
dingofs_raft_dir: "/mnt/data${service_replica_sequence}/dingofs-v5.1/raft/${service_role}"
dingofs_core_dir: "/mnt/data/corefiles/core-%e-%p-%t"
dingofs_default_replica_num: 3

# Coordinator service
coordinator_server_port: 6500
coordinator_raft_port: 7500

# Store service
store_server_port: 6600
store_raft_port: 7600
store_block_cache_size: 21474836480
store_mount_volumes: "/nas/dingofs/v5.1"

# MDS service
mds_base_port: 690
mds_replicas: 3
mds_compact_chunk_enable: true

# Executor service
executor_port: 18765
executor_mysql_port: 13307
executor_java_xms: 256m
executor_java_xmx: 1g
executor_java_soft_max_heap: 512m
executor_java_max_direct_memory: 256m

# --- Performance Tuning ---
tune_hugepages: 1024
tune_swappiness: 10
tune_max_map_count: 655360
tune_dirty_ratio: 40
tune_dirty_background_ratio: 10
tune_core_pattern: "/mnt/disk1/corefiles/core-%e-%p-%t"
tune_thp_mode: madvise
tune_cpupower_idle_disable: 3

# ============================================================
# Rootless Podman
# ============================================================
podman_rootless_user: "{{ dingofs_user }}"
podman_rootless_group: "{{ podman_rootless_user }}"
podman_rootless_home: "{{ '/root' if podman_rootless_user == 'root' else '/home/' ~ podman_rootless_user }}"
podman_rootless_storage_driver: overlay
podman_rootless_storage_base: /mnt/disk1
podman_rootless_graphroot: "{{ podman_rootless_storage_base }}/podman-{{ podman_rootless_user }}/data"
podman_rootless_runroot: "{{ podman_rootless_storage_base }}/podman-{{ podman_rootless_user }}/run"
podman_rootless_storage_conf: "{{ '/etc/containers/storage.conf' if podman_rootless_user == 'root' else podman_rootless_home ~ '/.config/containers/storage.conf' }}"
podman_rootless_xdg_runtime_dir: "/run/user/${UID}"

# ============================================================
# Cron Log Cleanup
# ============================================================
cron_cleanup_script_path: /root/dingofs/script/cron/cleanup_and_compression.sh
cron_cleanup_delete_days: 3
cron_cleanup_compress_days: 2
cron_cleanup_protected_files: []
cron_cleanup_directories:
  - "{{ dingo_cache_log_dir }}"
  - /mnt/disk1/dingofs/logs/alayanew
  - /mnt/disk1/dingofs/logs/manila

# ============================================================
# Dingo Cache
# ============================================================

# --- LVM ---
lvm_skip_vg_names:
  - csi-lvm
lvm_vg_prefix: dingo_cache
lvm_lv_name: lv
lvm_fs_type: xfs
lvm_mount_prefix: /mnt/disk

# Devices smaller than lvm_min_cache_disk_gb (decimal GB) are aux disks:
# combined into one VG (lvm_aux_vg_name) mounted at lvm_aux_mount for
# logs/corefiles, never used as cache. When all NVMe disks are >= the
# threshold, no aux mount is created and everything stays on /mnt/diskN.
lvm_min_cache_disk_gb: 1000
lvm_aux_vg_name: dingo_cache_aux
lvm_aux_mount: /mnt/aux

# --- Jemalloc ---
jemalloc_version: "5.3.0"
jemalloc_local_src: "/root/dingofs/pkg/jemalloc-5.3.0.tar.bz2"

# --- Dingo Cache Service ---
dingo_cache_version: v5.2
dingo_cache_service_name: dingo-cache-{{ dingo_cache_version }}
dingo_cache_base_dir: "/root/dingofs/dingo-cache/{{ dingo_cache_version }}"
dingo_cache_bin_name: dingo-cache
dingo_cache_bin_local_src: "/root/dingofs/pkg/dingo-cache"
dingo_cache_listen_port: 11000
dingo_cache_group_name: dingofs-group
dingo_cache_group_weight: 100
# Note: dingo_cache_cache_dirs and dingo_cache_cache_size_mb are dynamically
# auto-discovered at runtime from the actual LVM mount points created by lvm_cache.
# The static values below serve ONLY as fallback when lvm_cache has NOT been run yet.
# Leave as-is if you run cache_02_lvm.yml before cache_05_deploy.yml (recommended flow).

# Fraction of each disk's TOTAL capacity to use as cache (0.0 - 1.0).
# Total cache_size_mb = sum of (each_disk_total_mb × ratio) across all discovered disks.
# Example: 3 disks × 2TB total × 0.80 = ~4800000 MB
dingo_cache_disk_usage_ratio: 0.80
dingo_cache_cache_size_mb: 3145728   # FALLBACK only; auto-computed per-disk total × ratio overrides when LVM mounts exist
dingo_cache_free_space_ratio: "0.01"
dingo_cache_iodepth: 1024
# --- CPU pinning (v5.2; cpuset auto-detected per host at deploy time) ---
# Leave dingo_cache_cpuset empty so each node gets the SHARDS free whole cores
# on its own best NUMA node (RDMA device's node when its memory is cooler than
# the threshold, else the coolest node; fails over to the freest node when the
# preferred node is fully claimed). Set a cpuset ONLY per
# host (host_vars) for a hand-picked range such as 32-63 — never one
# fleet-wide value, free CPUs differ per node.
dingo_cache_shards: 8
dingo_cache_pin_cpu: true
dingo_cache_cpuset: ""
# ...or an explicit range/list per host in host_vars ("32-63",
# "37,39,43,46-49,53"). Overlap follows ..._on_insufficient below (force here
# = an overlapping explicit list is pinned anyway, with a LOUD warning).
# Empty = AUTO per host: NUMA node of dingo_cache_rdma_device, unless that node
# is hotter than dingo_cache_ib_node_mem_max_pct (OOM risk) — then the coolest
# node under the threshold. Set ONLY per host in host_vars to override.
dingo_cache_cpuset_numa_node: ""
# Skip-a-node memory threshold (mirrors the manual numa-mem.sh 50% rule).
dingo_cache_ib_node_mem_max_pct: 50
dingo_cache_cpuset_busy_pct: 30
# force (not fail): shared boxes like hd02-cpu-* have ZERO free CPUs, and the
# service must still start — pin onto occupied CPUs and contend rather than
# refuse to deploy. Only a host with fewer physical cores than shards still fails.
dingo_cache_cpuset_on_insufficient: force
dingo_cache_cpuset_include_siblings: false
# --- RDMA (v5.2; override dingo_cache_rdma_device per host in host_vars if HCA names differ) ---
dingo_cache_use_rdma: true
dingo_cache_rdma_device: ib6s200p0
dingo_cache_rdma_port_num: 1
dingo_cache_buffer_pool_mb: 1024
dingo_cache_rdma_idle_timeout_s: 300
# --- Poll mode (v5.2; needs pin_cpu + free cpuset, else it burns shared CPUs) ---
dingo_cache_poll_mode: true
dingo_cache_log_level: INFO
dingo_cache_log_v: 0
dingo_cache_ld_preload: /usr/local/lib/libjemalloc.so.2
dingo_cache_ip_pattern: "192.168."

dingo_cache_data_prefix: "/mnt/disk"
dingo_cache_log_prefix: "/mnt/aux"
dingo_cache_data_subdir: "dingofs/dingo-cache-v5.2"
dingo_cache_log_subdir: "dingofs/logs/dingo-cache-v5.2"

# NOTE: dingo_cache_log_dir is DERIVED every deploy by the prefix rule
# (log prefix else /mnt/disk1, + dingo_cache_log_subdir) — do not pin it here.
# With the values above this yields /mnt/aux/dingofs/logs/dingo-cache-v5.2.

# MDS addresses (host:port pairs, comma-separated)
dingo_cache_mds_addrs: "192.168.0.44:16900,192.168.0.44:16901,192.168.0.44:16902,192.168.0.45:16900,192.168.0.45:16901,192.168.0.45:16902,192.168.0.46:16900,192.168.0.46:16901,192.168.0.46:16902"

# ============================================================
# Dingo Client
# ============================================================

# Define multiple clients to deploy on the same host
dingo_clients:
  - fsname: alayanew
    mount_point: /dingofs/alayanew
    port: 12000
  - fsname: manila
    mount_point: /dingofs/manila
    port: 13000

# Fallback/default single instance configurations if dingo_clients is not defined
dingo_client_service_name: "dingofs-mount-{{ dingo_client_fsname }}"
dingo_client_base_dir: "/root/dingofs/dingo-client/{{ dingo_client_fsname }}"
dingo_client_bin_local_src: /root/dingofs/pkg/dingo-client
dingo_client_dingo_bin_local_src: /root/dingofs/pkg/dingo
dingo_client_cache_group: dingofs-group
dingo_client_log_dir: "/mnt/disk1/dingofs/logs/{{ dingo_client_fsname }}"
dingo_client_log_level: ERROR
dingo_client_log_v: 0
dingo_client_ld_preload: /usr/local/lib/libjemalloc.so.2

# Version suffix appended to every loop-built service unit, base dir and log
# dir (e.g. "-v5.2" -> dingofs-mount-<fs>-v5.2, .../<fs>-v5.2). Empty = unversioned.
# NOTE: do NOT version by templating dingo_client_service_name/base_dir/
# log_dir with {{ dingo_client_fsname }}-v5.2 — the loop ignores those globals
# (their braces arrive RAW and are never re-rendered; systemd then fails on a
# name with literal braces). This suffix is the supported knob.
dingo_client_version_suffix: "-v5.2"

# --- CPU pinning / RDMA (v5.2; same rules as dingo-cache: cpuset auto-detected per host) ---
# Leave dingo_client_cpuset empty: each mount gets SHARDS free whole cores, and
# mounts on the same host never share (alayanew's pick is excluded from manila's).
# Per-mount override (shards:/cpuset:/cpuset_numa_node:) on a dingo_clients entry
# when mounts must differ — e.g. a hand-picked range like 100-115.
# NOTE: auto-detect yields first-thread ids (8 ids for 8 shards). If your 100-115
# convention means HT pairs (8 cores x 2 threads), set
# dingo_client_cpuset_include_siblings: true to reproduce that shape automatically.
dingo_client_shards: 8
dingo_client_pin_cpu: true
dingo_client_cpuset: ""
# ...or an explicit range/list per host in host_vars (or cpuset: per mount).
# Overlap follows ..._on_insufficient below (force here = an overlapping
# explicit list is pinned anyway, with a LOUD warning).
# Empty = AUTO per host (RDMA device's NUMA node, memory permitting — same rule
# as dingo-cache). Per-mount cpuset_numa_node: overrides this per mount.
dingo_client_cpuset_numa_node: ""
# Skip-a-node memory threshold (mirrors the manual numa-mem.sh 50% rule).
dingo_client_ib_node_mem_max_pct: 50
dingo_client_cpuset_busy_pct: 30
# force (not fail): client hosts are fully shared — guarantee the mount starts
# by pinning onto occupied CPUs when nothing is free. Expect contention noise
# until CPUs are freed; the deploy log marks forced mounts LOUDLY.
dingo_client_cpuset_on_insufficient: force
dingo_client_cpuset_include_siblings: false
dingo_client_use_rdma: true
dingo_client_rdma_device: ib6s200p0
dingo_client_rdma_port_num: 1
dingo_client_buffer_pool_mb: 1024

# MDS addresses (same as dingo_cache_mds_addrs typically)
dingo_client_mds_addrs: "192.168.0.44:16900,192.168.0.44:16901,192.168.0.44:16902,192.168.0.45:16900,192.168.0.45:16901,192.168.0.45:16902,192.168.0.46:16900,192.168.0.46:16901,192.168.0.46:16902"

# FUSE / VFS tuning
dingo_client_cache_store: none
dingo_client_vfs_read_executor_thread: 32
dingo_client_vfs_read_buffer_total_mb: 32000
dingo_client_vfs_write_buffer_total_mb: 65536
dingo_client_vfs_prefetch_blocks: 0
dingo_client_fuse_max_threads: 512
dingo_client_fuse_enable_readdir_cache: "false"
dingo_client_fuse_attr_cache_timeout_s: 10
dingo_client_fuse_entry_cache_timeout_s: 10

# --- Dingo command environment (~/.dingo/dingo.yaml) ---
# mdsaddr is mandatory; reuses dingo_client_mds_addrs above.
dingo_env_mdsaddr: "{{ dingo_client_mds_addrs }}"
dingo_env_storagetype: s3          # s3 or rados
dingo_env_rpctimeout: 30s
dingo_env_rpcretrytimes: 5

# S3 backend (fill in for storagetype: s3)
dingo_env_s3_ak: ""
dingo_env_s3_sk: ""
dingo_env_s3_endpoint: ""
dingo_env_s3_bucketname: ""
dingo_env_s3_blocksize: 4 mib
dingo_env_s3_chunksize: 64 mib

# Rados backend (fill in for storagetype: rados)
dingo_env_rados_username: ""
dingo_env_rados_key: ""
dingo_env_rados_mon: ""
dingo_env_rados_poolname: ""
dingo_env_rados_blocksize: 4 mib
dingo_env_rados_chunksize: 64 mib