name: lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  yaml:
    name: YAML & playbook syntax
    runs-on: ubuntu-latest
    env:
      # Syntax checks do not load stdout callbacks. The callback job below
      # exercises the configured plugin through actual playbook runs.
      ANSIBLE_STDOUT_CALLBACK: ansible.builtin.default
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # setup-python looks for requirements.txt / pyproject.toml by
          # default; point it at the file that actually pins our deps.
          cache-dependency-path: requirements.yml

      # Install the full ansible bundle rather than ansible-core plus a
      # separate "ansible-galaxy collection install".
      #
      # Galaxy's dependency-map phase added ~140s to every run; the actual
      # downloads took under a second. The bundle already ships
      # community.general, ansible.posix and community.crypto (the three
      # collections this repo needs), so this is both faster and simpler.
      # requirements.yml stays as the declaration of what the repo depends
      # on for anyone installing collections by hand.
      - name: Install ansible
        run: pip install ansible

      # Plain YAML parsing first: its errors are more direct than ansible's.
      # This is what catches a plain (unquoted) scalar containing ": " --
      # the mistake that made every client playbook fail at parse time via
      # roles/dingo_client/tasks/instance.yml.
      - name: Parse every YAML file
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          import yaml

          class Loader(yaml.SafeLoader):
              """Tolerate unknown tags (e.g. !vault); only validate syntax."""

          Loader.add_multi_constructor("", lambda loader, suffix, node: None)

          files = sorted(
              p for p in pathlib.Path(".").rglob("*")
              if p.suffix in (".yml", ".yaml") and not {".git", ".ansible", ".venv"}.intersection(p.parts)
          )

          bad = []
          for f in files:
              try:
                  list(yaml.load_all(f.read_text(), Loader=Loader))
              except yaml.YAMLError as e:
                  bad.append((f, e))

          print(f"checked {len(files)} YAML files, {len(bad)} failed")
          for f, e in bad:
              first_line = str(e).splitlines()[0]
              print(f"::error file={f}::{first_line}")

          sys.exit(1 if bad else 0)
          PY

      # Then let ansible parse everything itself, which also covers role
      # references, variables and module usage.
      - name: ansible-playbook --syntax-check
        run: |
          fail=0
          for pb in playbooks/*.yml; do
            if ansible-playbook --syntax-check -i inventory/hosts.yml "$pb" >/dev/null 2>&1; then
              echo "OK   $pb"
            else
              echo "FAIL $pb"
              ansible-playbook --syntax-check -i inventory/hosts.yml "$pb" 2>&1 | tail -20
              echo "::error file=$pb::syntax-check failed"
              fail=1
            fi
          done
          exit $fail

  callback:
    name: Callback compatibility (${{ matrix.ansible }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            ansible: ansible-base==2.10.8
          - python: '3.9'
            ansible: ansible-core==2.12.10
          - python: '3.13'
            ansible: ansible-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ansible-core
        run: pip install '${{ matrix.ansible }}'
      # Ansible 2.10 imports environmentfilter, removed in Jinja2 3.1.
      - name: Install compatible Jinja2 for Ansible 2.10
        if: matrix.ansible == 'ansible-base==2.10.8'
        run: pip install 'jinja2<3.1'
      - name: Run ordinary and compact callback playbooks
        env:
          PYTHONPATH: tests
        run: >-
          python3 -m unittest -v
          test_client_discovery_report.DefaultOutputTests
          test_client_discovery.DiscoveryPlaybookTests

  regression:
    name: Regression tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      ANSIBLE_STDOUT_CALLBACK: ansible.builtin.default
      TEST_SHARD: ${{ matrix.shard }}
      TEST_SHARDS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.yml
      - name: Install ansible
        run: pip install ansible
      - name: Run regression shard
        run: |
          python3 - <<'PY'
          import os
          import sys
          import unittest

          def cases(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from cases(item)
                  else:
                      yield item

          # Stable discovery order distributes individual test cases, rather
          # than putting one large integration-test module on a single runner.
          loader = unittest.TestLoader()
          all_cases = list(cases(loader.discover('tests')))
          shard = int(os.environ['TEST_SHARD'])
          count = int(os.environ['TEST_SHARDS'])
          selected = all_cases[shard::count]
          if not all_cases or not selected:
              raise SystemExit('Regression discovery produced an empty shard')
          print(f'Shard {shard + 1}/{count}: {len(selected)} of {len(all_cases)} tests', flush=True)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(selected))
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
