---
- name: Validate the existing controller CLI when downloads are disabled
  delegate_to: localhost
  become: false
  run_once: true
  when: not (dingo_cli_download_enabled | bool)
  block:
    - name: Inspect the staged worker CLI on the controller
      stat:
        path: "{{ dingo_cli_download_dest }}"
        get_checksum: false
        get_mime: false
      register: _dingo_cli_staged_source

    - name: Require the worker CLI to be staged before offline distribution
      assert:
        that:
          - _dingo_cli_staged_source.stat.isreg | default(false)
          - _dingo_cli_staged_source.stat.size | default(0) | int > 0
        fail_msg: >-
          CLI downloads are disabled. Prepare the worker CLI at
          {{ dingo_cli_download_dest }} on the Ansible controller, or explicitly
          set dingo_cli_download_enabled=true for a download run.

# Fetch latest on the controller once per play, then let copy compare each
# target's content. Check mode uses the cached source without fetching a URL.
- name: Refresh the independent CLI binary on the control node
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - dingo_cli_download_enabled | bool
    - not ansible_check_mode
  block:
    - name: Keep the latest client CLI separate from the manually staged server CLI
      assert:
        that:
          - (dingo_cli_download_dest | realpath) != (dingo_cli_pkg_path | default('/root/dingofs/pkg/dingo') | realpath)
        fail_msg: >-
          Client latest download destination {{ dingo_cli_download_dest }} must
          differ from the manually staged server CLI path
          {{ dingo_cli_pkg_path | default('/root/dingofs/pkg/dingo') }}.

    - name: Ensure the controller CLI download directory exists
      file:
        path: "{{ dingo_cli_download_dest | dirname }}"
        state: directory
        mode: "0755"

    - name: Download the latest CLI to the control node
      get_url:
        url: "{{ dingo_cli_download_url }}"
        dest: "{{ dingo_cli_download_dest }}"
        force: true
        checksum: "{{ dingo_cli_download_checksum if dingo_cli_download_checksum | length > 0 else omit }}"
        mode: "0755"
