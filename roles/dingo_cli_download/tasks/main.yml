---
- name: Select the configured controller CLI source
  set_fact:
    dingo_cli_resolved_source: "{{ dingo_cli_download_dest }}"

- name: Validate the existing controller CLI when downloads are disabled
  delegate_to: localhost
  become: false
  run_once: true
  when: not (dingo_cli_download_enabled | bool)
  block:
    - name: Inspect the preferred worker CLI on the controller
      stat:
        path: "{{ dingo_cli_download_dest }}"
        follow: true
        get_checksum: false
        get_mime: false
      register: _dingo_cli_preferred_source

    - name: Fall back to the staged CLI when latest is missing and auto-upgrade is disabled
      set_fact:
        dingo_cli_resolved_source: "{{ dingo_cli_pkg_path | default('/root/dingofs/pkg/dingo') }}"
      when:
        - not (dingo_cli_auto_upgrade | default(false) | bool)
        - not _dingo_cli_preferred_source.stat.exists
        - (dingo_cli_download_dest | realpath) == (dingo_cli_latest_pkg_path | realpath)

    - name: Inspect the selected worker CLI on the controller
      stat:
        path: "{{ dingo_cli_resolved_source }}"
        follow: true
        get_checksum: false
        get_mime: false
      register: _dingo_cli_staged_source

    - name: Require the worker CLI to be staged before offline distribution
      assert:
        that:
          - _dingo_cli_staged_source.stat.isreg | default(false)
          - _dingo_cli_staged_source.stat.size | default(0) | int > 0
        fail_msg: >-
          CLI downloads are disabled. Prepare the worker CLI at
          {{ dingo_cli_resolved_source }} on the Ansible controller
          (preferred source: {{ dingo_cli_download_dest }};
          staged fallback: {{ dingo_cli_pkg_path | default('/root/dingofs/pkg/dingo') }}), or explicitly
          set dingo_cli_download_enabled=true for a download run.

# Fetch latest on the controller once per play, then let copy compare each
# target's content. Check mode uses the cached source without fetching a URL.
- name: Refresh the independent CLI binary on the control node
  delegate_to: localhost
  become: false
  run_once: true
  when:
    - dingo_cli_download_enabled | bool
    - not ansible_check_mode
  block:
    - name: Keep the latest client CLI separate from the manually staged server CLI
      assert:
        that:
          - (dingo_cli_download_dest | realpath) != (dingo_cli_pkg_path | default('/root/dingofs/pkg/dingo') | realpath)
        fail_msg: >-
          Client latest download destination {{ dingo_cli_download_dest }} must
          differ from the manually staged server CLI path
          {{ dingo_cli_pkg_path | default('/root/dingofs/pkg/dingo') }}.

    - name: Require a verified worker CLI download
      assert:
        that: dingo_cli_download_checksum is match('^sha256:[0-9a-fA-F]{64}$')
        fail_msg: "Set dingo_cli_download_checksum=sha256:<trusted hash> before enabling downloads."

    - name: Ensure the controller CLI download directory exists
      file:
        path: "{{ dingo_cli_download_dest | dirname }}"
        state: directory
        mode: "0755"

    - name: Allocate a private candidate path beside the staged CLI
      tempfile:
        state: file
        path: "{{ dingo_cli_download_dest | dirname }}"
        prefix: .dingo-candidate-
      register: _dingo_cli_candidate

    - name: Verify the candidate before replacing the staged worker CLI
      block:
        - name: Download the latest CLI to the control node
          get_url:
            url: "{{ dingo_cli_download_url }}"
            dest: "{{ _dingo_cli_candidate.path }}"
            force: true
            checksum: "{{ dingo_cli_download_checksum }}"
            mode: "0755"

        - name: Validate that the candidate CLI can execute
          command:
            argv: ["{{ _dingo_cli_candidate.path }}", --version]
          changed_when: false

        - name: Install the verified worker CLI and preserve the previous file
          copy:
            src: "{{ _dingo_cli_candidate.path }}"
            dest: "{{ dingo_cli_download_dest }}"
            remote_src: true
            backup: true
            mode: "0755"
      always:
        - name: Remove the temporary CLI candidate
          file:
            path: "{{ _dingo_cli_candidate.path }}"
            state: absent
