---
# ============================================================
# Role: dingo_cli - Install and configure Dingo CLI tool
# ============================================================

# --- Distribute the manually prepared compatible server CLI ---
- name: Ensure .dingo directory exists
  file:
    path: "{{ dingofs_home }}/.dingo"
    state: directory
    owner: "{{ dingofs_user }}"
    group: "{{ dingofs_user }}"
    mode: "0755"

- name: Ensure dingo CLI bin directory exists
  file:
    path: "{{ dingo_cli_bin_dir }}"
    state: directory
    owner: "{{ dingofs_user }}"
    group: "{{ dingofs_user }}"
    mode: "0755"

- name: Copy the prepared server CLI into its cluster-specific bin directory
  copy:
    src: "{{ dingo_cli_pkg_path }}"
    dest: "{{ dingo_cli_bin_dir }}/dingo"
    owner: "{{ dingofs_user }}"
    group: "{{ dingofs_user }}"
    mode: "0755"

# Config must be written before the first invocation: `dingo --version` connects
# to [database].url. With the deploy-config task placed after the init task (as
# it was), a stale url caused every re-run to fail in init with
# "Error-Code: 100000 / connect: connection refused", never reaching the task
# that would have rewritten the config.
- name: Deploy dingocli.cfg configuration
  become: true
  become_user: "{{ dingofs_user }}"
  template:
    src: dingocli.cfg.j2
    dest: "{{ dingofs_home }}/.dingo/dingocli.cfg"
    owner: "{{ dingofs_user }}"
    group: "{{ dingofs_user }}"
    mode: "0600"
  diff: false
  no_log: true

# --- Initialize dingo CLI ---
- name: Initialize dingo CLI (creates ~/.dingo directory)
  become: true
  become_user: "{{ dingofs_user }}"
  command: "{{ dingo_cli_bin_dir }}/dingo --version"
  register: dingo_init
  changed_when: false

# --- Configure PATH ---
- name: Add dingo CLI to PATH in bash_profile
  become: true
  become_user: "{{ dingofs_user }}"
  lineinfile:
    path: "{{ dingofs_home }}/.bash_profile"
    line: 'export PATH=$PATH:{{ dingo_cli_bin_dir }}'
    regexp: '.*\.dingo/bin.*'
    state: present
    create: true
    mode: "0644"

# --- Verify installation ---
- name: Verify dingo CLI is functional
  become: true
  become_user: "{{ dingofs_user }}"
  command: "{{ dingo_cli_bin_dir }}/dingo --version"
  register: dingo_version
  changed_when: false

- name: Display dingo CLI version
  debug:
    var: dingo_version.stdout
