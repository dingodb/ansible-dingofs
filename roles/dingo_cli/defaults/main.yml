---
# True installs the prepared server executable while preserving existing config,
# validates the candidate before installation and preserves dingocli.cfg.
dingo_cli_update_existing: false
# Manually supplied compatible server CLI on the Ansible controller. No URL.
dingo_cli_pkg_path: /root/dingofs/pkg/dingo
dingo_cli_bin_dir: "{{ dingofs_home }}/.dingo/bin/server-{{ dingofs_cluster_name | default(dingofs_version | default('default')) }}"

dingo_cli_log_level: error
dingo_cli_timeout: 300
dingo_cli_auto_upgrade: false
dingo_cli_engine: podman
dingo_cli_ssh_retries: 3
dingo_cli_ssh_timeout: 10
dingo_cli_db_url: "rqlite://{{ rqlite_master_host }}:{{ rqlite_http_port }}"
dingo_cli_sudo_alias: ""
