---
# ============================================================
# Role: dingo_client_upgrade - Upgrade dingo-client binaries
# ============================================================

# Optional runtime filter (comma-separated string or list of fsname, /mount_point,
# or service_name) to upgrade a subset of enabled dingo_clients entries.
dingo_client_only: ""

# Binary source (from control node)
dingo_client_upgrade_bin_src: "{{ dingo_client_bin_local_src }}"

# Script settings
dingo_client_upgrade_dry_run: false
dingo_client_upgrade_script_path: /tmp/dingofs_restart_check.sh

dingo_client_mount_check_script: /tmp/dingofs_mount_usage_check.sh
dingo_client_mount_check_strict: false
dingo_client_ignore_stale_mounts: false

# When a mountpoint is busy at precheck, stage the updated binary on disk
# (atomic replacement + .bak + .restart-required) and defer ONLY the systemd
# restart until idle. Set to false to skip busy instances before touching disk.
dingo_client_stage_when_busy: true
