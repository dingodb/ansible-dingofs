---
# Upgrade a single dingo-client instance

- name: "Set facts for {{ client_instance.fsname }}"
  set_fact:
    _base_dir: "{{ client_instance.base_dir | default('/root/dingofs/dingo-client/' ~ client_instance.fsname ~ (dingo_client_version_suffix | default(''))) }}"
    _bin_path: "{{ (client_instance.base_dir | default('/root/dingofs/dingo-client/' ~ client_instance.fsname ~ (dingo_client_version_suffix | default('')))) }}/bin/dingo-client"
    _bak_path: "{{ (client_instance.base_dir | default('/root/dingofs/dingo-client/' ~ client_instance.fsname ~ (dingo_client_version_suffix | default('')))) }}/bin/dingo-client.bak"
    _upgrade_unit: "{{ client_instance.service_name | default('dingofs-mount-' ~ client_instance.fsname ~ (dingo_client_version_suffix | default(''))) }}"

- name: Check mount usage before upgrading this instance
  command:
    argv: [bash, "{{ dingo_client_mount_check_script }}", "{{ client_instance.mount_point }}", --dry-run, --strict]
  register: _upgrade_usage
  changed_when: false
  failed_when: _upgrade_usage.rc not in [0, 1]

- name: Report a deferred client upgrade
  debug:
    msg: "{{ client_instance.fsname }} is busy; retry after its users have drained."
  when: _upgrade_usage.rc == 1

- name: Upgrade only this idle client instance
  include_tasks: upgrade_idle.yml
  when:
    - _upgrade_usage.rc == 0
    - not (dingo_client_upgrade_dry_run | bool)
