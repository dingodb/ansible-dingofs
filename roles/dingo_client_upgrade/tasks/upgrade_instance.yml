---
# Upgrade a single dingo-client instance

- name: "Set facts for {{ client_instance.fsname }}"
  set_fact:
    _base_dir: "{{ client_instance.base_dir | default('/root/dingofs/dingo-client/' ~ client_instance.fsname ~ (dingo_client_version_suffix | default(''))) }}"
    _bin_path: "{{ (client_instance.base_dir | default('/root/dingofs/dingo-client/' ~ client_instance.fsname ~ (dingo_client_version_suffix | default('')))) }}/bin/dingo-client"
    _bak_path: "{{ (client_instance.base_dir | default('/root/dingofs/dingo-client/' ~ client_instance.fsname ~ (dingo_client_version_suffix | default('')))) }}/bin/dingo-client.bak"
    _upgrade_unit: "{{ client_instance.service_name | default('dingofs-mount-' ~ client_instance.fsname ~ (dingo_client_version_suffix | default(''))) }}"

- name: Set client report identity for this upgrade instance
  set_fact:
    _dingofs_client_report_context:
      operation: upgrade
      fsname: "{{ client_instance.fsname }}"
      mount_point: "{{ client_instance.mount_point }}"
      service: "{{ _upgrade_unit }}"

- name: Record the start of this client upgrade
  import_tasks: ../../common/tasks/client_report.yml
  vars:
    client_report_stage: precheck
    client_report_status: started
    client_report_reason: checking_mount_usage
    client_report_changed_on_disk: false

- name: Check mount usage before upgrading this instance
  command:
    argv: "{{ ['bash', dingo_client_mount_check_script, client_instance.mount_point, '--dry-run'] + (['--strict'] if dingo_client_mount_check_strict | default(false) | bool else []) + (['--ignore-stale-mounts'] if dingo_client_ignore_stale_mounts | default(false) | bool else []) }}"
  register: _upgrade_usage
  changed_when: false
  failed_when: _upgrade_usage.rc not in [0, 1]

- name: Report a deferred client upgrade (precheck skip)
  debug:
    msg: >-
      {{ client_instance.fsname }} is busy; skipping without changing disk
      (dingo_client_stage_when_busy=false). Retry after its users have drained.
      {{ _upgrade_usage.stdout_lines | default([]) | select('search', 'IN USE|BUSY|pod=|pid=|container=|namespace=') | list | join(' | ') }}
  when:
    - _upgrade_usage.rc | default(-1) | int == 1
    - not (dingo_client_stage_when_busy | default(true) | bool)

- name: Record this busy upgrade as unchanged
  import_tasks: ../../common/tasks/client_report.yml
  vars:
    client_report_stage: precheck
    client_report_status: skipped_busy_before_change
    client_report_reason: mount_in_use
    client_report_changed_on_disk: false
  when:
    - _upgrade_usage.rc | default(-1) | int == 1
    - not (dingo_client_stage_when_busy | default(true) | bool)

- name: Record an upgrade dry run
  import_tasks: ../../common/tasks/client_report.yml
  vars:
    client_report_stage: precheck
    client_report_status: dry_run
    client_report_reason: upgrade_dry_run
    client_report_changed_on_disk: false
  when:
    - dingo_client_upgrade_dry_run | bool
    - >-
      (_upgrade_usage.rc | default(-1) | int == 0)
      or ((_upgrade_usage.rc | default(-1) | int == 1)
          and (dingo_client_stage_when_busy | default(true) | bool))

- name: Note staged upgrade on busy mountpoint
  debug:
    msg: >-
      STAGING {{ client_instance.fsname }} on {{ inventory_hostname }}:
      {{ client_instance.mount_point }} is in use; updating binary on disk and
      deferring restart of {{ _upgrade_unit }} until idle.
      {{ _upgrade_usage.stdout_lines | default([]) | select('search', 'IN USE|BUSY|pod=|pid=|container=|namespace=') | list | join(' | ') }}
  when:
    - _upgrade_usage.rc | default(-1) | int == 1
    - dingo_client_stage_when_busy | default(true) | bool
    - not (dingo_client_upgrade_dry_run | bool)

- name: Upgrade or stage this client instance
  include_tasks: upgrade_idle.yml
  when:
    - not (dingo_client_upgrade_dry_run | bool)
    - >-
      (_upgrade_usage.rc | default(-1) | int == 0)
      or ((_upgrade_usage.rc | default(-1) | int == 1)
          and (dingo_client_stage_when_busy | default(true) | bool))
