---
- name: Record that this idle client binary is being upgraded
  import_tasks: ../../common/tasks/client_report.yml
  vars:
    client_report_stage: configure
    client_report_status: started
    client_report_reason: upgrading_binary

# --- Step 1: Backup current binary ---
- name: "Check if current binary exists for {{ client_instance.fsname }}"
  stat:
    path: "{{ _bin_path }}"
  register: _bin_stat

- name: Require an installed client binary
  assert:
    that: _bin_stat.stat.isreg | default(false)
    fail_msg: "Deploy this client instance before using the upgrade entry point."

- name: Inspect the candidate on the controller
  delegate_to: localhost
  become: false
  stat:
    path: "{{ dingo_client_upgrade_bin_src }}"
    follow: true
  register: _upgrade_candidate

- name: Require a readable candidate binary
  assert:
    that: _upgrade_candidate.stat.isreg | default(false)

- name: Record the restart obligation before replacing the binary
  copy:
    content: "restart required\n"
    dest: "{{ _base_dir }}/.restart-required"
    mode: "0600"
  when: _upgrade_candidate.stat.checksum != _bin_stat.stat.checksum

# cp -p with `creates`, not mv: the backup has to survive a second upgrade.
# `mv` ran unconditionally, so a second pass moved the freshly deployed binary
# over .bak -- the known-good rollback copy was silently replaced by the new
# (possibly broken) one, exactly when you would want it back.
- name: "Backup current binary for {{ client_instance.fsname }}"
  command: "cp -p {{ _bin_path }} {{ _bak_path }}"
  args:
    creates: "{{ _bak_path }}"
  when: _bin_stat.stat.exists

# --- Step 2: Copy new binary ---
- name: "Copy new dingo-client binary for {{ client_instance.fsname }}"
  copy:
    src: "{{ dingo_client_upgrade_bin_src }}"
    dest: "{{ _bin_path }}"
    mode: "0755"
  register: _upgrade_copy

- name: Check for an outstanding restart
  stat:
    path: "{{ _base_dir }}/.restart-required"
  register: _upgrade_pending

- name: Apply the outstanding restart
  when: _upgrade_pending.stat.exists
  block:
    - name: Record the last usage check before upgrade restart
      import_tasks: ../../common/tasks/client_report.yml
      vars:
        client_report_stage: restart_check
        client_report_status: started
        client_report_reason: checking_mount_before_restart
        client_report_changed_on_disk: "{{ _upgrade_copy.changed | bool and not ansible_check_mode }}"
        client_report_pending_restart: true

    - name: Recheck mount usage immediately before restart
      command:
        argv: "{{ ['bash', dingo_client_mount_check_script, client_instance.mount_point, '--dry-run'] + (['--strict'] if dingo_client_mount_check_strict | default(false) | bool else []) }}"
      register: _upgrade_recheck
      changed_when: false
      failed_when: _upgrade_recheck.rc not in [0, 1]

    - name: Record a restart deferred after the binary update
      import_tasks: ../../common/tasks/client_report.yml
      vars:
        client_report_stage: restart_check
        client_report_status: restart_deferred_busy
        client_report_reason: mount_in_use
        client_report_changed_on_disk: "{{ _upgrade_copy.changed | bool and not ansible_check_mode }}"
        client_report_pending_restart: true
      when: _upgrade_recheck.rc | default(-1) == 1

    - name: Restart and verify only a client that remains idle
      when: _upgrade_recheck.rc | default(-1) == 0
      block:
        - name: Record the upgrade restart attempt
          import_tasks: ../../common/tasks/client_report.yml
          vars:
            client_report_stage: restart
            client_report_status: started
            client_report_reason: restarting_service
            client_report_changed_on_disk: "{{ _upgrade_copy.changed | bool and not ansible_check_mode }}"
            client_report_pending_restart: true

        - name: Restart this client service
          systemd:
            name: "{{ _upgrade_unit }}"
            state: restarted

        - name: Record the start of upgraded mount verification
          import_tasks: ../../common/tasks/client_report.yml
          vars:
            client_report_stage: verify
            client_report_status: started
            client_report_reason: verifying_restarted_mount
            client_report_changed_on_disk: "{{ _upgrade_copy.changed | bool and not ansible_check_mode }}"
            client_report_pending_restart: true

        - name: Verify the restarted mount
          command:
            argv: [mountpoint, -q, "{{ client_instance.mount_point }}"]
          register: _upgraded_mount
          until: _upgraded_mount.rc == 0
          retries: 10
          delay: 3
          changed_when: false

        - name: Clear the completed restart marker
          file:
            path: "{{ _base_dir }}/.restart-required"
            state: absent

- name: Record the completed client upgrade
  import_tasks: ../../common/tasks/client_report.yml
  vars:
    client_report_stage: complete
    client_report_status: "{{ 'dry_run' if ansible_check_mode else ('restart_deferred_busy' if _upgrade_pending.stat.exists and _upgrade_recheck.rc | default(-1) == 1 else 'completed') }}"
    client_report_reason: "{{ 'check_mode' if ansible_check_mode else ('mount_in_use' if _upgrade_pending.stat.exists and _upgrade_recheck.rc | default(-1) == 1 else ('restarted' if _upgrade_pending.stat.exists else 'unchanged')) }}"
    client_report_changed_on_disk: "{{ _upgrade_copy.changed | bool and not ansible_check_mode }}"
    client_report_pending_restart: "{{ _upgrade_pending.stat.exists and _upgrade_recheck.rc | default(-1) != 0 }}"
