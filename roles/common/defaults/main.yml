---
dingofs_user: dingofs
# SSH-only by default. Supply a vaulted hash to enable password authentication.
dingofs_password_hash: "!"
dingofs_controller_public_key: ""
dingofs_controller_public_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa.pub"
dingofs_install_controller_key: true
dingofs_home: /home/dingofs
dingofs_pkg_dir: /home/dingofs/pkg
dingofs_script_dir: /home/dingofs/script

dingofs_ssh_key_type: rsa
dingofs_ssh_key_bits: 4096

common_basic_packages:
  - fio
  - numactl
  - nvme-cli
  - gcc
  - make
