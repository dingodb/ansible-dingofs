---
dingo_cache_version: v5.1
dingo_cache_base_dir: "/root/dingofs/dingo-cache/{{ dingo_cache_version }}"
dingo_cache_bin_name: dingo-cache
dingo_cache_bin_local_src: "/root/dingofs/pkg/dingo-cache"

dingo_cache_listen_port: 11000
dingo_cache_group_name: openclaw-group
# group_weight is AUTO-COMPUTED at deploy time as:
#   dingo_cache_group_weight = weight_per_disk × number of selected cache disks
# (see tasks/main.yml). Weight is relative among nodes of the same cache group, so
# a node with more disks carries proportionally more requests. Static value below is
# a FALLBACK only.
dingo_cache_weight_per_disk: 20
dingo_cache_group_weight: 100   # FALLBACK only — overridden by auto-computed weight
# Fraction of each selected disk's TOTAL capacity to use as cache (0.0 - 1.0).
# Disk selection (auto-discovery, see tasks/main.yml): mounts smaller than
# dingo_cache_min_disk_gb are EXCLUDED from caching (the first excluded disk is reused
# as the log disk), and the remaining mounts are narrowed to the largest same-spec group
# (uniform capacity), so a SINGLE cache_size_mb = smallest_group_capacity × ratio applies
# to every selected disk. Example: 3 uniform 3.49T disks × 0.80 → ~2,928,000 MB each.
# When lvm_cache has NOT been run yet (no mounts discovered), falls back to the static
# dingo_cache_cache_size_mb / dingo_cache_cache_dirs values below.
dingo_cache_disk_usage_ratio: 0.80
# Disks with total capacity below this size (GB, decimal) never hold dingo-cache data.
# Default 1000 GB = 1 TB — i.e. a ~894 GiB (~960 GB) disk is excluded from caching.
dingo_cache_min_disk_gb: 1000

# VG name prefix used by the LVM-based half of the discovery below.
# This is lvm_cache's variable, and this role only ever worked because
# inventory/group_vars happened to define it as well -- an implicit cross-role
# dependency that breaks any inventory not carrying the lvm_* block (a
# meta-only region, say). Default it here so the role stands on its own;
# a group_vars value still wins, so no existing region changes behaviour.
lvm_vg_prefix: dingo_cache

# Second way to find cache disks: any mount whose mount point starts with the
# data/log prefixes counts as a cache/log disk candidate, alongside the
# dingo_cache_* LVM volumes. Empty (default) = LVM volumes only, i.e. the
# original behaviour.
#
# Data and log prefixes are SEPARATE because they may live on different
# devices -- e.g. data on /mnt/diskN but logs on /mnt/aux.
#   dingo_cache_data_prefix: "/mnt/disk"    # picks up /mnt/disk0, /mnt/disk1, ...
#   dingo_cache_log_prefix: "/mnt/aux"      # picks up the aux/log mount
dingo_cache_data_prefix: ""
dingo_cache_log_prefix: ""
# DEPRECATED fallback: when the split prefixes above are empty, each falls
# back to this single prefix (original behaviour). Prefer setting
# dingo_cache_data_prefix / dingo_cache_log_prefix directly.
dingo_cache_mount_prefix: ""
dingo_cache_cache_size_mb: 3145728   # FALLBACK only — overridden by auto-selection when LVM mounts exist
dingo_cache_free_space_ratio: "0.01"
dingo_cache_iodepth: 1024
dingo_cache_log_level: INFO
dingo_cache_log_v: 0
dingo_cache_ld_preload: /usr/local/lib/libjemalloc.so.2
dingo_cache_ip_pattern: "192.168."

# NUMA node fallback (v5.2: no numactl binding — the start script runs unbound).
# Only used as the last-resort preferred node when neither an explicit
# dingo_cache_cpuset_numa_node nor any per-node memory data exists (e.g. VMs).
dingo_cache_numa_node: 0

# --- CPU pinning (v5.2+: --shards/--pin_cpu/--cpuset) ---
dingo_cache_shards: 8
dingo_cache_pin_cpu: true
# Manual override: a range ("32-63") or an explicit CPU list
# ("37,39,43,46-49,53" — e.g. the least-busy CPUs from a cpuset-check.sh
# fallback suggest). Empty (default) = auto-detect per host at deploy time.
# Overlap with claimed CPUs follows dingo_cache_cpuset_on_insufficient below
# (fail stops, warn drops the list to auto-detect, force pins it anyway);
# offline CPUs always fail. Set ONLY per host in host_vars, never fleet-wide.
dingo_cache_cpuset: ""
# Preferred NUMA node for the auto-detected cpuset. Empty (default) = AUTO:
# the NUMA node of dingo_cache_rdma_device
# (/sys/class/net/<device>/device/numa_node), unless that node is hotter than
# dingo_cache_ib_node_mem_max_pct — then the coolest node under the threshold.
# Set this ONLY to override the IB/memory decision per host or inventory.
dingo_cache_cpuset_numa_node: ""
# A node more memory-used than this % is skipped as preferred (bootstrap OOM
# risk); the deploy warns LOUDLY when every node is hotter than this.
dingo_cache_ib_node_mem_max_pct: 50
# CPUs busier than this % (mpstat 1s sample, skipped when sysstat is absent)
# are excluded from auto-detection.
dingo_cache_cpuset_busy_pct: 30
# fail|warn|force when a node cannot offer <shards> free whole cores on the
# preferred NUMA node — and when a MANUAL dingo_cache_cpuset overlaps claimed
# CPUs. fail = stop the deploy. warn = keep going WITHOUT --cpuset (cache still
# starts, just unpinned) — use only to survey a fleet; an overlapping manual
# list is dropped back to auto-detect instead.
# force = pin onto OCCUPIED CPUs anyway (least-busy pick by sampled usage,
# so the service still starts on fully-shared boxes; shards will contend until
# CPUs are freed. Only fail-vs-host-too-small still stops a force deploy.
dingo_cache_cpuset_on_insufficient: fail
# When true, the auto-detected cpuset expands to all sibling threads of the
# selected cores; false (default) keeps first-thread ids only, i.e. one shard
# per physical core with no hyperthread sharing.
dingo_cache_cpuset_include_siblings: false

# --- RDMA (v5.2+: --use_rdma/--cache_rdma_device/--cache_rdma_port_num/--buffer_pool_mb/--rdma_idle_timeout_s) ---
dingo_cache_use_rdma: true
dingo_cache_rdma_device: ib6s200p0
dingo_cache_rdma_port_num: 1
dingo_cache_buffer_pool_mb: 1024
dingo_cache_rdma_idle_timeout_s: 300

# --- Poll mode (v5.2+: --poll_mode) ---
# Poll mode busy-spins the selected CPUs — only meaningful together with
# pin_cpu + an isolated/free cpuset. Turn off on shared/undersized hosts.
dingo_cache_poll_mode: true

# Sub-directories (relative to each cache mount point / log disk) used by the
# auto-selection logic. Default is UNVERSIONED (dingofs/dingo-cache): the block
# on-disk format is layout-compatible across versions, so keeping the same dir +
# --id reuses existing cache data on upgrade. Override to a versioned path only
# when you deliberately want per-version data isolation (needs old-dir cleanup).
dingo_cache_data_subdir: "dingofs/dingo-cache"
dingo_cache_log_subdir: "dingofs/logs/dingo-cache"
dingo_cache_cache_dirs: "/mnt/disk1/dingofs/dingo-cache,/mnt/disk2/dingofs/dingo-cache,/mnt/disk3/dingofs/dingo-cache"
dingo_cache_log_dir: "/mnt/disk4/dingofs/logs/dingo-cache"

dingo_cache_mds_addrs: ""

dingo_cache_service_name: dingo-cache
