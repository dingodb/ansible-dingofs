---
dingo_cache_version: v5.1
dingo_cache_base_dir: "/root/dingofs/dingo-cache/{{ dingo_cache_version }}"
dingo_cache_bin_name: dingo-cache
dingo_cache_bin_local_src: "/root/dingofs/pkg/dingo-cache"

dingo_cache_listen_port: 11000
dingo_cache_group_name: openclaw-group
# group_weight is AUTO-COMPUTED at deploy time as:
#   dingo_cache_group_weight = weight_per_disk × number of selected cache disks
# (see tasks/main.yml). Weight is relative among nodes of the same cache group, so
# a node with more disks carries proportionally more requests. Static value below is
# a FALLBACK only.
dingo_cache_weight_per_disk: 20
dingo_cache_group_weight: 100   # FALLBACK only — overridden by auto-computed weight
# Fraction of each selected disk's TOTAL capacity to use as cache (0.0 - 1.0).
# Disk selection (auto-discovery, see tasks/main.yml): mounts smaller than
# dingo_cache_min_disk_gb are EXCLUDED from caching (the first excluded disk is reused
# as the log disk), and the remaining mounts are narrowed to the largest same-spec group
# (uniform capacity), so a SINGLE cache_size_mb = smallest_group_capacity × ratio applies
# to every selected disk. Example: 3 uniform 3.49T disks × 0.80 → ~2,928,000 MB each.
# When lvm_cache has NOT been run yet (no mounts discovered), falls back to the static
# dingo_cache_cache_size_mb / dingo_cache_cache_dirs values below.
dingo_cache_disk_usage_ratio: 0.80
# Disks with total capacity below this size (GB, decimal) never hold dingo-cache data.
# Default 1000 GB = 1 TB — i.e. a ~894 GiB (~960 GB) disk is excluded from caching.
dingo_cache_min_disk_gb: 1000
dingo_cache_cache_size_mb: 3145728   # FALLBACK only — overridden by auto-selection when LVM mounts exist
dingo_cache_free_space_ratio: "0.01"
dingo_cache_iodepth: 1024
dingo_cache_log_level: INFO
dingo_cache_log_v: 0
dingo_cache_ld_preload: /usr/local/lib/libjemalloc.so.2
dingo_cache_ip_pattern: "192.168."

# NUMA binding: which NUMA node to bind dingo-cache to.
# NOTE: Only effective on multi-NUMA machines. Single-NUMA VMs/small hosts skip numactl automatically.
dingo_cache_numa_node: 0

# Sub-directories (relative to each cache mount point / log disk) used by the
# auto-selection logic. Default is UNVERSIONED (dingofs/dingo-cache): the block
# on-disk format is layout-compatible across versions, so keeping the same dir +
# --id reuses existing cache data on upgrade. Override to a versioned path only
# when you deliberately want per-version data isolation (needs old-dir cleanup).
dingo_cache_data_subdir: "dingofs/dingo-cache"
dingo_cache_log_subdir: "dingofs/logs/dingo-cache"
dingo_cache_cache_dirs: "/mnt/disk1/dingofs/dingo-cache,/mnt/disk2/dingofs/dingo-cache,/mnt/disk3/dingofs/dingo-cache"
dingo_cache_log_dir: "/mnt/disk4/dingofs/logs/dingo-cache"

dingo_cache_mds_addrs: ""

dingo_cache_service_name: dingo-cache
