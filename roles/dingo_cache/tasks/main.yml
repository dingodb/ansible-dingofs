---
# ============================================================
# Role: dingo_cache - Deploy dingo-cache service
# ============================================================

# --- Version guard: branch = version, fail before writing anything ---
# (see roles/version_guard; the v5.2 conf below is not readable by v5.1 binaries)
- import_role:
    name: version_guard

# --- Determine listen IP ---
- name: Detect listen IP from network interface
  shell: ip route | awk '/{{ dingo_cache_ip_pattern }}/ && /src/ { for(i=1;i<=NF;i++) if($i=="src"){print $(i+1); exit}}'
  register: detected_ip
  changed_when: false
  when: dingo_cache_listen_ip is not defined

- name: Set listen IP fact
  set_fact:
    dingo_cache_listen_ip: "{{ dingo_cache_listen_ip | default(detected_ip.stdout | default(ansible_host)) }}"

- name: Validate listen IP
  assert:
    that:
      - dingo_cache_listen_ip | length > 0
    fail_msg: "Could not determine listen IP. Set dingo_cache_listen_ip or dingo_cache_ip_pattern."

# --- Generate UUID for config ID ---
- name: Check for existing config file
  stat:
    path: "{{ dingo_cache_base_dir }}/dingo-cache.conf"
  register: existing_conf

- name: Read existing config ID
  shell: grep '^--id=' "{{ dingo_cache_base_dir }}/dingo-cache.conf" | sed 's/^--id=//'
  register: existing_id
  changed_when: false
  when: existing_conf.stat.exists

# Deterministic per-machine ID so the SAME host always gets the SAME id no
# matter how often it is redeployed or which version base_dir/conf path it uses.
# Cache data lives under cache_dir/<id>, so a stable id is what lets an upgrade
# REUSE the existing on-disk cache (see disk_cache_layout RealCacheDir).
# Existing deployments keep their old id via the task above; brand-new hosts get
# this stable one instead of random uuidgen.
#
# Identity seed, because no single source works everywhere:
#   - KVM/cloud clones share /etc/machine-id (template not reset) but have a
#     UNIQUE SMBIOS system-uuid assigned by the hypervisor  -> use SMBIOS first
#   - bare metal has all-zero/unset SMBIOS uuid but a unique machine-id
#     -> fall back to machine-id (reset it when cloning images)
#
# ⚠️ Two corrections to that plan, both learned the hard way on 2026-09-16 when
#    four bj09 nodes ended up with the SAME id and could not join the cache
#    group ("Fail to send JoinCacheGroup rpc request ... cache member has
#    locked", ELOCKED from mds/cachegroup/member_manager.cc:137):
#
#    1. Only a FULLY zero SMBIOS uuid means "no uuid". The old glob
#       `00000000-0000-0000-0000-*` also matched partially-zero uuids such as
#       00000000-0000-0000-0000-905a0817c1ed, which are perfectly unique per
#       host. Treating them as invalid sent those hosts to machine-id, which
#       they share (cloned images), so they hashed to the same id.
#       Match the all-zero and all-ff forms exactly instead.
#
#    2. The hostname is appended to the hashed string as well. Both fallback
#       sources can be duplicated across a fleet; the hostname cannot (it is
#       the k8s node name) and is stable. This is what makes the id unique
#       even when the seed is not.
#
# NOTE: existing dingo-cache.conf files keep their recorded --id (the task
# below returns early when the conf exists), so changing this formula does not
# move the cache of an already-deployed node. It only affects nodes that have
# no conf yet, plus any node whose --id is removed to force a regeneration.
- name: Generate deterministic config ID (stable per machine)
  shell: |
    smbios=$(dmidecode -s system-uuid 2>/dev/null | tr 'A-F' 'a-f')
    case "$smbios" in
      ""|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)
        seed=$(cat /etc/machine-id 2>/dev/null || hostname) ;;
      *) seed="$smbios" ;;
    esac
    python3 -c "import sys, uuid; print(uuid.uuid5(uuid.NAMESPACE_DNS, 'dingofs-cache:' + sys.argv[1] + ':' + sys.argv[2]))" "$seed" "$(hostname)"
  register: generated_uuid
  changed_when: false
  when: not existing_conf.stat.exists

- name: Set config ID fact
  set_fact:
    dingo_cache_config_id: "{{ existing_id.stdout | default(generated_uuid.stdout) }}"

# --- Preferred NUMA node: IB device + memory aware (v5.2, no numactl) ---
# v5.2 drops numactl binding, so locality comes from CHOOSING the right node's
# CPUs: the NUMA node of the RDMA device first
# (/sys/class/net/<rdma_device>/device/numa_node — your manual step 1), unless
# that node is hot on memory (> dingo_cache_ib_node_mem_max_pct, default 50%
# — your manual numa-mem.sh check). A hot node risks bootstrap OOM, so the
# lowest-memory node under the threshold wins instead; if every node is hot,
# the lowest-memory node wins anyway and the deploy warns LOUDLY.
- name: Read NUMA node of the RDMA device
  shell: "cat '/sys/class/net/{{ dingo_cache_rdma_device | default('ib6s200p0') }}/device/numa_node' 2>/dev/null || echo unknown"
  register: _cache_ib_numa_raw
  changed_when: false
  failed_when: false
  when:
    - dingo_cache_pin_cpu | default(true) | bool
    - dingo_cache_use_rdma | default(true) | bool
    - (dingo_cache_rdma_device | default('ib6s200p0')) | length > 0

- name: Sample per-NUMA-node memory usage
  shell: |
    for f in /sys/devices/system/node/node[0-9]*/meminfo; do
      [ -e "$f" ] || continue
      n=$(basename "$(dirname "$f")" | tr -dc '0-9')
      total=$(awk '$3=="MemTotal:" {print $4}' "$f")
      free=$(awk '$3=="MemFree:" {print $4}' "$f")
      case "$total" in ''|0) continue;; esac
      echo "MEM $n $(( (total - free) * 100 / total ))"
    done
  register: _cache_numa_mem
  changed_when: false
  failed_when: false
  when: dingo_cache_pin_cpu | default(true) | bool

- name: Build per-node memory map
  set_fact:
    _cache_node_mem: "{{ (_cache_node_mem | default({})) | combine({(item.split()[1]): (item.split()[2] | int)}) }}"
  loop: "{{ _cache_numa_mem.stdout_lines | default([]) | select('match', '^MEM [0-9]+ [0-9]+$') | list }}"
  when: dingo_cache_pin_cpu | default(true) | bool

- name: Decide preferred NUMA node from IB device and memory headroom
  set_fact:
    _cache_ib_node: >-
      {{ _cache_ib_numa_raw.stdout | default('unknown') | trim
         if (_cache_ib_numa_raw.stdout | default('unknown') | trim is match('^[0-9]+$'))
         else '' }}
    _cache_mem_thr: "{{ dingo_cache_ib_node_mem_max_pct | default(50) | int }}"
    _cache_explicit_node: "{{ dingo_cache_cpuset_numa_node | default('') | string | trim }}"
    _cache_mem_lowest: "{{ (_cache_node_mem | default({}) | dict2items | sort(attribute='value') | map(attribute='key') | list | first | default('')) | string }}"
    _cache_mem_coolest: "{{ (_cache_node_mem | default({}) | dict2items | selectattr('value', 'le', (dingo_cache_ib_node_mem_max_pct | default(50) | int)) | sort(attribute='value') | map(attribute='key') | list | first | default('')) | string }}"
  when: dingo_cache_pin_cpu | default(true) | bool

- name: Select preferred NUMA node
  set_fact:
    _cache_preferred_node: "{{ _cache_explicit_node if (_cache_explicit_node | length > 0) else (_cache_ib_node if (_cache_ib_node | length > 0 and ((_cache_node_mem | default({})).get(_cache_ib_node, 101) | int) <= (_cache_mem_thr | int)) else (_cache_mem_coolest if (_cache_mem_coolest | length > 0) else (_cache_mem_lowest if (_cache_mem_lowest | length > 0) else (dingo_cache_numa_node | default(0) | string)))) }}"
    _cache_mem_all_hot: "{{ (_cache_node_mem | default({}) | length > 0) and (_cache_mem_coolest | default('') | length == 0) and (_cache_explicit_node | default('') | length == 0) }}"
  when: dingo_cache_pin_cpu | default(true) | bool

- name: Log preferred NUMA node decision
  debug:
    msg: >-
      IB device {{ dingo_cache_rdma_device | default('ib6s200p0') }} on NUMA node
      {{ _cache_ib_node | default('unknown', true) | trim or 'unknown' }}
      (mem {{ (_cache_node_mem | default({})).get(_cache_ib_node | default(''), 'n/a') }}%),
      per-node mem {{ _cache_node_mem | default({}) }}, threshold {{ _cache_mem_thr }}% →
      preferred node {{ _cache_preferred_node }}
      {{ '(explicit override)' if (_cache_explicit_node | length > 0)
         else ('(IB node, memory OK)' if (_cache_preferred_node == _cache_ib_node and (_cache_ib_node | length > 0))
         else ('(IB node hot — OOM risk avoided)' if not (_cache_mem_all_hot | bool)
         else '(ALL NODES HOT — OOM RISK, lowest-memory node picked)')) }}
  when: dingo_cache_pin_cpu | default(true) | bool

# --- CPU set resolution for --pin_cpu/--cpuset (v5.2+, dynamic per host) ---
# Same free-CPU claim logic as the manual cpuset-check.sh triage script
# (kernel isolation, cgroup cpusets, kubelet exclusive CPUs, process
# --cpuset=/affinity, 1s /proc/stat usage sample, NUMA topology), but in
# suggest/check modes the role can parse. Free CPUs differ per node, so this
# runs on every target — never bake one node's cpuset into group_vars for the
# whole fleet.
# Manual override (dingo_cache_cpuset) accepts a range ("32-63") or an explicit
# CPU list ("37,39,43,46-49,53"). Structural errors (offline CPUs) always fail;
# overlap with claimed CPUs follows dingo_cache_cpuset_on_insufficient: fail =
# stop, warn = drop the list back to auto-detect, force = pin it anyway loudly.
# Auto-detect is two-pass: preferred NUMA node first (IB device's node when its
# memory headroom is OK, else the coolest node — keeps RDMA and allocation
# local without numactl), then the node with the most free whole cores — a GPU
# host whose preferred node is fully claimed still deploys elsewhere. When no
# node has enough free cores, force falls back to the LEAST-BUSY CPUs by
# sampled usage instead of failing.
- name: Resolve cpuset for CPU pinning
  block:
    - name: Validate cpuset insufficiency policy
      assert:
        that:
          - (dingo_cache_cpuset_on_insufficient | default('fail')) in ['fail', 'warn', 'force']
        fail_msg: >-
          dingo_cache_cpuset_on_insufficient must be one of fail|warn|force, got
          '{{ dingo_cache_cpuset_on_insufficient }}'. fail = stop the deploy;
          warn = deploy WITHOUT --cpuset (unpinned); force = pin onto occupied
          CPUs anyway so the service still starts (overlap WILL contend).

    - name: Deploy cpuset detection script
      copy:
        src: cpuset-detect.sh
        dest: /tmp/dingo-cpuset-detect.sh
        mode: "0755"
      changed_when: false

    - name: Validate manually configured cpuset
      shell: |
        /tmp/dingo-cpuset-detect.sh --no-busy -S dingo-cache \
          -s {{ dingo_cache_shards | int }} \
          -b {{ dingo_cache_cpuset_busy_pct | int }} \
          -c "{{ dingo_cache_cpuset }}"
      register: cpuset_check
      changed_when: false
      failed_when: false
      when: (dingo_cache_cpuset | default('')) | length > 0

    - name: Fail on offline CPUs in manual cpuset
      assert:
        that:
          - "'NOT-ONLINE' not in (cpuset_check.stdout | default(''))"
        fail_msg: >-
          --cpuset={{ dingo_cache_cpuset }} on {{ inventory_hostname }} contains
          CPUs that are not even online:
          {{ cpuset_check.stdout_lines | default([]) | join('; ') }}.
          Fix dingo_cache_cpuset to online CPUs only (compare with
          /sys/devices/system/cpu/online on the host).
      when: (dingo_cache_cpuset | default('')) | length > 0

    - name: Fail on overlapping manual cpuset
      assert:
        that:
          - cpuset_check.rc is defined and cpuset_check.rc == 0
        fail_msg: >-
          --cpuset={{ dingo_cache_cpuset }} on {{ inventory_hostname }} overlaps CPUs
          already claimed elsewhere, so dingo-cache would fight another workload:
          {{ cpuset_check.stdout_lines | default([]) | join('; ') }}.
          Either clear dingo_cache_cpuset (auto-detect picks free CPUs per host),
          choose a free range — re-run /tmp/dingo-cpuset-detect.sh on the host —
          or keep this exact list deliberately via
          dingo_cache_cpuset_on_insufficient=force (warns LOUDLY, pins anyway).
      when:
        - (dingo_cache_cpuset | default('')) | length > 0
        - (dingo_cache_cpuset_on_insufficient | default('fail')) == 'fail'

    - name: Warn and keep overlapping manual cpuset (force policy)
      debug:
        msg: >-
          WARNING: --cpuset={{ dingo_cache_cpuset }} on {{ inventory_hostname }}
          overlaps already-claimed CPUs
          ({{ cpuset_check.stdout_lines | default([]) | join('; ') }}), but
          dingo_cache_cpuset_on_insufficient=force — deploying PINNED onto this
          explicit list anyway (e.g. idle-but-pinned CPUs like 37,39,43,46-49,53).
          Shards WILL contend with whatever holds those CPUs until they free up.
      when:
        - (dingo_cache_cpuset | default('')) | length > 0
        - cpuset_check.rc is defined and cpuset_check.rc != 0
        - "'NOT-ONLINE' not in (cpuset_check.stdout | default(''))"
        - (dingo_cache_cpuset_on_insufficient | default('fail')) == 'force'

    - name: Warn that overlapping manual cpuset is dropped (warn policy)
      debug:
        msg: >-
          WARNING: --cpuset={{ dingo_cache_cpuset }} on {{ inventory_hostname }}
          overlaps already-claimed CPUs
          ({{ cpuset_check.stdout_lines | default([]) | join('; ') }}), and
          dingo_cache_cpuset_on_insufficient=warn — dropping the manual list and
          falling back to auto-detect (may deploy unpinned). Use =force to pin
          onto this explicit list anyway.
      when:
        - (dingo_cache_cpuset | default('')) | length > 0
        - cpuset_check.rc is defined and cpuset_check.rc != 0
        - "'NOT-ONLINE' not in (cpuset_check.stdout | default(''))"
        - (dingo_cache_cpuset_on_insufficient | default('fail')) == 'warn'

    - name: Drop overlapping manual cpuset (warn policy)
      set_fact:
        dingo_cache_cpuset: ""
      when:
        - (dingo_cache_cpuset | default('')) | length > 0
        - cpuset_check.rc is defined and cpuset_check.rc != 0
        - "'NOT-ONLINE' not in (cpuset_check.stdout | default(''))"
        - (dingo_cache_cpuset_on_insufficient | default('fail')) == 'warn'

    # Stability first: a redeploy must NOT see the service's own running cpuset
    # as "taken" and hop to new CPUs every run (which would restart the cache
    # for nothing and break the idempotency contract in cache_site.yml). The
    # already-deployed cpuset is re-validated IGNORING our own process (-S) and
    # our own poll-mode spin (--no-busy); only a REAL new conflict moves it.
    - name: Read cpuset from existing config
      shell: "grep '^--cpuset=' '{{ dingo_cache_base_dir }}/dingo-cache.conf' 2>/dev/null | cut -d= -f2- || true"
      register: cpuset_existing
      changed_when: false
      when: (dingo_cache_cpuset | default('')) | length == 0

    - name: Re-validate existing cpuset
      shell: |
        /tmp/dingo-cpuset-detect.sh --no-busy -S dingo-cache \
          -b {{ dingo_cache_cpuset_busy_pct | int }} \
          -c "{{ cpuset_existing.stdout | trim }}"
      register: cpuset_recheck
      changed_when: false
      failed_when: false
      when:
        - (dingo_cache_cpuset | default('')) | length == 0
        - cpuset_existing.stdout is defined and (cpuset_existing.stdout | trim) | length > 0

    - name: Keep existing cpuset when it still validates
      set_fact:
        dingo_cache_cpuset_effective: "{{ cpuset_existing.stdout | trim }}"
        dingo_cache_numa_node_effective: >-
          {{ ((cpuset_recheck.stdout_lines | select('match', '^NODES=') | first | default('') | regex_replace('^NODES=', '') | trim | regex_replace(' .*', '')) or (dingo_cache_numa_node | default(0))) }}
        _cpuset_source: "kept from existing config"
      when:
        - (dingo_cache_cpuset | default('')) | length == 0
        - cpuset_recheck.rc is defined and cpuset_recheck.rc == 0

    - name: Auto-detect free cpuset on preferred NUMA node
      shell: |
        /tmp/dingo-cpuset-detect.sh -S dingo-cache \
          -s {{ dingo_cache_shards | int }} \
          -n {{ _cache_preferred_node | default(dingo_cache_numa_node | default(0)) }} \
          -b {{ dingo_cache_cpuset_busy_pct | int }} \
          {{ '--siblings' if dingo_cache_cpuset_include_siblings | default(false) | bool else '' }}
      register: cpuset_detect_preferred
      changed_when: false
      failed_when: false
      when:
        - (dingo_cache_cpuset | default('')) | length == 0
        - cpuset_recheck.rc is not defined or cpuset_recheck.rc != 0

    - name: Auto-detect free cpuset on best NUMA node (fallback)
      shell: |
        /tmp/dingo-cpuset-detect.sh -S dingo-cache \
          -s {{ dingo_cache_shards | int }} \
          -b {{ dingo_cache_cpuset_busy_pct | int }} \
          {{ '--siblings' if dingo_cache_cpuset_include_siblings | default(false) | bool else '' }}
      register: cpuset_detect_fallback
      changed_when: false
      failed_when: false
      when:
        - (dingo_cache_cpuset | default('')) | length == 0
        - cpuset_recheck.rc is not defined or cpuset_recheck.rc != 0
        - cpuset_detect_preferred.rc is defined and cpuset_detect_preferred.rc != 0

    - name: Select winning cpuset detection result
      set_fact:
        _cpuset_winner: "{{ cpuset_detect_preferred if cpuset_detect_preferred.rc == 0 else cpuset_detect_fallback }}"
        _cpuset_source: "{{ 'preferred NUMA node ' + (_cache_preferred_node | default(dingo_cache_numa_node | default(0)) | string) if cpuset_detect_preferred.rc == 0 else 'fallback NUMA node ' + (cpuset_detect_fallback.stdout_lines | select('match', '^NODE=') | first | default('NODE=?') | regex_replace('^NODE=', '')) }}"
      when:
        - (dingo_cache_cpuset | default('')) | length == 0
        - cpuset_recheck.rc is not defined or cpuset_recheck.rc != 0

    - name: Fail when no NUMA node offers enough free cores
      assert:
        that:
          - _cpuset_winner.rc == 0
        fail_msg: >-
          No {{ dingo_cache_shards }} free whole cores on {{ inventory_hostname }}:
          preferred node {{ _cache_preferred_node | default(dingo_cache_numa_node | default(0)) }}
          gave [{{ cpuset_detect_preferred.stdout_lines | default([]) | join(' ') }}],
          best-of-rest gave
          [{{ cpuset_detect_fallback.stdout_lines | default(['(preferred node already had enough — fallback never ran)']) | join(' ') }}].
          Either free CPUs on this host, lower dingo_cache_shards, set
          dingo_cache_cpuset_on_insufficient=warn to deploy unpinned, or =force
          to pin onto occupied CPUs anyway (service starts, shards contend).
      when:
        - (dingo_cache_cpuset | default('')) | length == 0
        - cpuset_recheck.rc is not defined or cpuset_recheck.rc != 0
        - (dingo_cache_cpuset_on_insufficient | default('fail')) == 'fail'

    - name: Warn when deploying without a cpuset
      debug:
        msg: >-
          WARNING: no {{ dingo_cache_shards }} free whole cores on
          {{ inventory_hostname }} — deploying WITHOUT --cpuset (unpinned).
          Expect noisy-neighbour latency, especially with poll_mode=true.
          Detector said: {{ _cpuset_winner.stdout_lines | default([]) | join(' ') }}
      when:
        - (dingo_cache_cpuset | default('')) | length == 0
        - cpuset_recheck.rc is not defined or cpuset_recheck.rc != 0
        - (dingo_cache_cpuset_on_insufficient | default('fail')) == 'warn'
        - _cpuset_winner.rc is defined and _cpuset_winner.rc != 0

    - name: Force best-effort cpuset from occupied CPUs
      set_fact:
        dingo_cache_cpuset_effective: "{{ _cpuset_winner.stdout_lines | select('match', '^FORCED=') | first | default('FORCED=NONE') | regex_replace('^FORCED=', '') | trim }}"
        dingo_cache_numa_node_effective: "{{ ((_cpuset_winner.stdout_lines | select('match', '^FORCED_NODE=') | first | default('') | regex_replace('^FORCED_NODE=', '') | trim) or (dingo_cache_numa_node | default(0))) }}"
        _cpuset_source: "FORCED overlap — no free CPUs anywhere on this host, shards WILL contend with whatever runs there. Free CPUs or add capacity ASAP."
        _cpuset_forced: true
      when:
        - (dingo_cache_cpuset | default('')) | length == 0
        - cpuset_recheck.rc is not defined or cpuset_recheck.rc != 0
        - (dingo_cache_cpuset_on_insufficient | default('fail')) == 'force'
        - _cpuset_winner.rc is defined and _cpuset_winner.rc != 0

    - name: Fail when even a forced cpuset is impossible
      assert:
        that:
          - dingo_cache_cpuset_effective not in ['NONE', '']
        fail_msg: >-
          {{ inventory_hostname }} has fewer than {{ dingo_cache_shards }} physical
          cores in total — no cpuset, free or forced, can be built. This host
          cannot run dingo-cache with {{ dingo_cache_shards }} shards; lower
          dingo_cache_shards or add CPUs.
      when:
        - (dingo_cache_cpuset | default('')) | length == 0
        - cpuset_recheck.rc is not defined or cpuset_recheck.rc != 0
        - (dingo_cache_cpuset_on_insufficient | default('fail')) == 'force'
        - _cpuset_winner.rc is defined and _cpuset_winner.rc != 0

    - name: Set effective cpuset and NUMA facts
      set_fact:
        dingo_cache_cpuset_effective: >-
          {{ (dingo_cache_cpuset | default('')) if (dingo_cache_cpuset | default('')) | length > 0
             else (_cpuset_winner.stdout_lines | select('match', '^SUGGEST=') | first | default('SUGGEST=NONE') | regex_replace('^SUGGEST=', '')) }}
        dingo_cache_numa_node_effective: >-
          {{ (_cpuset_winner.stdout_lines | select('match', '^NODE=') | first | default('') | regex_replace('^NODE=', ''))
             if (dingo_cache_cpuset | default('')) | length == 0 and _cpuset_winner.rc == 0
             else (dingo_cache_numa_node | default(0)) }}
      when:
        - cpuset_recheck.rc is not defined or cpuset_recheck.rc != 0
        - (_cpuset_forced | default(false)) == false

    - name: Warn when the effective NUMA node is short on free memory
      debug:
        msg: >-
          WARNING: NUMA node {{ dingo_cache_numa_node_effective }} on
          {{ inventory_hostname }} is
          {{ (_cache_node_mem | default({})).get(dingo_cache_numa_node_effective | string, 'n/a') }}%
          memory-used (threshold {{ _cache_mem_thr | default(50) }}%) — bootstrap
          OOM risk. Free memory on this node or pin to a cooler node via
          dingo_cache_cpuset_numa_node.
      when:
        - (dingo_cache_cpuset | default('')) | length == 0
        - dingo_cache_cpuset_effective is defined and dingo_cache_cpuset_effective not in ['NONE', '']
        - dingo_cache_numa_node_effective is defined
        - ((_cache_node_mem | default({})).get(dingo_cache_numa_node_effective | string, 0) | int) > (_cache_mem_thr | default(50) | int)

    - name: Log forced-pick CPU usage
      debug:
        msg: >-
          FORCED least-busy pick on {{ inventory_hostname }}: cpuset=
          {{ dingo_cache_cpuset_effective }} (node
          {{ dingo_cache_numa_node_effective }}) — sampled 1s /proc/stat usage %
          per CPU
          [{{ _cpuset_winner.stdout_lines | select('match', '^FORCED_USAGE=') | first | default('FORCED_USAGE=') | regex_replace('^FORCED_USAGE=', '') }}].
          These CPUs ARE claimed or busy elsewhere, so shards WILL contend with
          whatever holds them until CPUs free up.
      when:
        - (_cpuset_forced | default(false)) == true
        - _cpuset_winner.stdout_lines is defined

    - name: Log cpuset selection
      debug:
        msg: >-
          cpuset={{ dingo_cache_cpuset_effective | default('NONE (unpinned)') }}
          ({{ 'manual override' if (dingo_cache_cpuset | default('')) | length > 0 else ('auto-detected on ' + (_cpuset_source | default('unknown node'))) }},
          shards={{ dingo_cache_shards }},
          no numactl in v5.2 — locality is the cpuset's node)
  when: dingo_cache_pin_cpu | default(true) | bool

# --- RDMA device validation (v5.2+, only when RDMA is on) ---
# The IB device name (e.g. ib6s200p0) comes from the host's HCA layout — if it
# differs per node, override dingo_cache_rdma_device per host in host_vars.
- name: Check RDMA device exists
  shell: "ibv_devices 2>/dev/null | awk '{print $1}' | grep -qx '{{ dingo_cache_rdma_device }}' && echo present || echo missing"
  register: rdma_dev_check
  changed_when: false
  failed_when: false
  when: dingo_cache_use_rdma | default(true) | bool

- name: Fail when RDMA device is missing
  assert:
    that:
      - rdma_dev_check.stdout | trim == 'present'
    fail_msg: >-
      RDMA device {{ dingo_cache_rdma_device }} not found on {{ inventory_hostname }}
      (ibv_devices says: {{ rdma_dev_check.stdout | trim }}; if the ibv_devices
      tool itself is missing, the InfiniBand stack is not installed).
      Set the right name per host via dingo_cache_rdma_device in host_vars, or
      dingo_cache_use_rdma=false to deploy without RDMA.
  when:
    - dingo_cache_use_rdma | default(true) | bool
    - rdma_dev_check.stdout is defined
    - rdma_dev_check.stdout | trim == 'missing'

# --- Resolve effective data/log mount prefixes ---
# dingo_cache_mount_prefix is the deprecated single-prefix fallback: each
# split prefix defaults to it when empty, so existing inventories that only
# set the old variable keep working unchanged.
- name: Resolve effective data/log prefixes
  set_fact:
    _dingo_cache_data_prefix: "{{ dingo_cache_data_prefix | default('') if (dingo_cache_data_prefix | default('')) | length > 0 else (dingo_cache_mount_prefix | default('')) }}"
    _dingo_cache_log_prefix: "{{ dingo_cache_log_prefix | default('') if (dingo_cache_log_prefix | default('')) | length > 0 else (dingo_cache_mount_prefix | default('')) }}"

# --- Detect actual cache mount points (dynamic, per-host) ---
# Always run: the uniform-spec selection below (measure mounts → exclude disks smaller
# than dingo_cache_min_disk_gb → keep only the largest same-size group) takes
# precedence over statically configured values. If no mounts found (lvm_cache not yet
# run), fall back to group_vars / role defaults.
- name: Discover mounted cache volumes
  shell: |
    {
      mount | grep '{{ lvm_vg_prefix }}_' | awk '{print $3}'
      {% if _dingo_cache_data_prefix | length > 0 %}
      # index(...) == 1 is a literal prefix test -- "^"p would treat the prefix as a regex
      mount | awk -v p='{{ _dingo_cache_data_prefix }}' 'index($3, p) == 1 {print $3}'
      {% endif %}
      {% if _dingo_cache_log_prefix | length > 0 and _dingo_cache_log_prefix != _dingo_cache_data_prefix %}
      mount | awk -v p='{{ _dingo_cache_log_prefix }}' 'index($3, p) == 1 {print $3}'
      {% endif %}
    } | sort -u -V
  register: discovered_mounts
  changed_when: false
  failed_when: false

- name: Validate at least one mount point is available
  assert:
    that:
      - discovered_mounts.stdout_lines | length > 0
    fail_msg: >-
      No cache disks found on this host (neither mounted dingo_cache_* LVM volumes
      nor a mount under dingo_cache_data_prefix / dingo_cache_log_prefix).
      Either run cache_02_lvm.yml first, or point dingo_cache_data_prefix /
      dingo_cache_log_prefix at the
      mount points that should hold cache data / logs (for hosts where dingo-cache shares
      disks with another role).
      Failing fast here prevents dingo-cache from silently falling back to writing on the system disk.

# --- Select uniform-spec cache disks (dynamic, per-host) ---
# Policy: (1) exclude disks smaller than dingo_cache_min_disk_gb (default 1000 GB) from caching,
# (2) keep only the LARGEST same-spec group (disks within 1% of each other) so that a
# single cache_size_mb = group_capacity × disk_usage_ratio applies to every selected disk.
# A log prefix on a separate tree is still reserved for logs -- those mounts are
# never used as cache disks -- but a log prefix nested inside the data prefix
# stays a cache candidate under the normal size rule; the log dir itself
# follows the prefix rule below, not disk measurement.
# All selected disks share one cache_size_mb — no per-disk ":size" suffix needed.
- name: Measure mounts and select uniform cache disk set
  shell: |
    python3 - <<'PYEOF'
    import json, os

    mounts = """{{ discovered_mounts.stdout_lines | join('\n') }}""".split()
    min_gb = {{ dingo_cache_min_disk_gb | int }}
    ratio = {{ dingo_cache_disk_usage_ratio | float }}
    data_subdir = "{{ dingo_cache_data_subdir }}"
    log_prefix = "{{ _dingo_cache_log_prefix }}"
    data_prefix = "{{ _dingo_cache_data_prefix }}"

    def gib(b):
        return "%.2f GiB" % (b / (1024.0 ** 3))

    disks = []
    for mp in mounts:
        st = os.statvfs(mp)
        disks.append([mp, st.f_blocks * st.f_frsize])

    for mp, total in sorted(disks, key=lambda d: d[1]):
        print("  %-28s total=%s" % (mp, gib(total)))

    group = [d for d in disks if d[1] >= min_gb * (10**9)]
    # A log prefix on a SEPARATE tree is reserved for logs -- never use those
    # mounts as cache disks even when large enough to qualify. But when the log
    # prefix is nested inside the data prefix (e.g. data /mnt/disk + log
    # /mnt/disk1), it is the same device tree: those mounts stay cache
    # candidates under the normal size rule. Plain string-prefix test on
    # purpose, matching how these prefixes are used everywhere else in this
    # role (awk index() == 1 discovery, _data_p* shell globs).
    if log_prefix and log_prefix != data_prefix \
            and not log_prefix.startswith(data_prefix) \
            and not data_prefix.startswith(log_prefix):
        group = [d for d in group if not d[0].startswith(log_prefix)]
    if group:
        largest = max(d[1] for d in group)
        group = [d for d in group if d[1] >= largest * 0.99]

    skipped = [d for d in disks if d not in group]
    size_mb = int(min(d[1] for d in group) * ratio / (1024 * 1024)) if group else 0
    # NOTE: the log dir is NOT picked here -- it follows the prefix rule
    # (effective log prefix, else /mnt/disk1, + dingo_cache_log_subdir).

    result = {
        "dirs": ["%s/%s" % (d[0], data_subdir) for d in group],
        "count": len(group),
        "size_mb": size_mb,
        "skipped": ["%s (%s)" % (d[0], gib(d[1])) for d in skipped],
    }
    print("JSON=" + json.dumps(result))
    PYEOF
  register: disk_selection
  changed_when: false
  when: discovered_mounts.stdout_lines | length > 0

- name: Apply disk selection facts
  set_fact:
    _cache_sel: "{{ disk_selection.stdout_lines | last | regex_replace('^JSON=', '') | from_json }}"
  when: disk_selection is succeeded

- name: Assert at least one qualifying uniform disk was found
  assert:
    that:
      - _cache_sel.dirs | length > 0
    fail_msg: >-
      No disk qualifies for dingo-cache on this host: every mount is smaller than
      dingo_cache_min_disk_gb ({{ dingo_cache_min_disk_gb }} GB) or no
      same-spec group exists. Lower the threshold in inventory/group_vars/all.yml,
      or only run cache_02_lvm.yml on hosts with uniform NVMe disks >= 1 TB.
  when: disk_selection is succeeded

- name: Use selected uniform cache dirs (single cache_size_mb applies to all)
  set_fact:
    dingo_cache_cache_dirs: "{{ _cache_sel.dirs | join(',') }}"
    dingo_cache_cache_size_mb: "{{ _cache_sel.size_mb }}"
    dingo_cache_group_weight: "{{ (_cache_sel.count | int) * (dingo_cache_weight_per_disk | int) }}"
  when: disk_selection is succeeded and _cache_sel.dirs | length > 0

# --- Log dir: prefix rule (not disk measurement) ---
# dingo_cache_log_dir = effective log prefix + dingo_cache_log_subdir when a
# log prefix exists (_dingo_cache_log_prefix, i.e. dingo_cache_log_prefix else
# the deprecated dingo_cache_mount_prefix), else /mnt/disk1 + subdir.
# Unconditional: the log path is deterministic config, independent of which
# disks qualified for caching. (An explicitly pinned dingo_cache_log_dir in
# host_vars is superseded by this rule — pin via log_prefix/log_subdir.)
- name: Set dingo-cache log dir from prefix rule
  set_fact:
    dingo_cache_log_dir: "{{ ((_dingo_cache_log_prefix | default('') | trim | regex_replace('/+$', '')) if ((_dingo_cache_log_prefix | default('') | trim) | length > 0) else '/mnt/disk1') + '/' + (dingo_cache_log_subdir | default('dingofs/logs/dingo-cache') | trim | regex_replace('^/+', '')) }}"

- name: Log cache disk selection summary
  debug:
    msg: >-
      Selected {{ _cache_sel.dirs | length }} uniform disk(s):
      {{ _cache_sel.dirs | join(', ') }}
      cache_size_mb={{ _cache_sel.size_mb }} MB per disk
      ({{ dingo_cache_disk_usage_ratio }} × capacity, {{ dingo_cache_free_space_ratio }}
      free-space floor) group_weight={{ dingo_cache_group_weight }}
      ({{ _cache_sel.count }} disk(s) × {{ dingo_cache_weight_per_disk }} per disk)
      iodepth={{ dingo_cache_iodepth }} per disk
      excluded from cache: {{ _cache_sel.skipped | join('; ') if _cache_sel.skipped | length > 0 else 'none' }}
      log_dir={{ dingo_cache_log_dir }}
  when: disk_selection is succeeded

# --- Create directories ---
- name: Create dingo-cache base directory
  file:
    path: "{{ dingo_cache_base_dir }}"
    state: directory
    mode: "0755"

- name: Create cache directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ dingo_cache_cache_dirs.split(',') }}"

- name: Create log directory
  file:
    path: "{{ dingo_cache_log_dir }}"
    state: directory
    mode: "0755"

# --- Copy binary from control node ---
# notify, like the conf/unit/start-script tasks below: without it a rebuilt
# binary landed on disk and the service kept running the old one until the
# next unrelated restart. dingo_client got exactly this fix earlier
# ("restart idle mounts only, and notice binary changes"); the cache side was
# missed.
#
# Cost, so it is a deliberate one: a cache restart drops this node's cache and
# its clients reconnect. The role already accepts that for any config change
# (see the header of cache_site.yml) -- a stale binary is not different.
- name: Copy dingo-cache binary to remote host
  copy:
    src: "{{ dingo_cache_bin_local_src }}"
    dest: "{{ dingo_cache_base_dir }}/{{ dingo_cache_bin_name }}"
    mode: "0755"
  notify: restart dingo-cache

# --- Deploy config and scripts ---
- name: Deploy dingo-cache config file
  template:
    src: dingo-cache.conf.j2
    dest: "{{ dingo_cache_base_dir }}/dingo-cache.conf"
    mode: "0644"
  notify: restart dingo-cache

- name: Deploy dingo-cache startup script
  template:
    src: dingo-cache-start.sh.j2
    dest: "{{ dingo_cache_base_dir }}/dingo-cache-start.sh"
    mode: "0755"
  notify: restart dingo-cache

# --- Deploy systemd service ---
- name: Deploy dingo-cache systemd service
  template:
    src: dingo-cache.service.j2
    dest: "/etc/systemd/system/{{ dingo_cache_service_name }}.service"
    mode: "0644"
  notify: restart dingo-cache

- name: Reload systemd daemon
  systemd:
    daemon_reload: true

- name: Enable and start dingo-cache service
  systemd:
    name: "{{ dingo_cache_service_name }}"
    enabled: true
    state: started

- name: Wait for dingo-cache to be ready
  wait_for:
    port: "{{ dingo_cache_listen_port }}"
    host: "{{ dingo_cache_listen_ip }}"
    delay: 3
    timeout: 60

- name: Display dingo-cache service status
  shell: systemctl is-active {{ dingo_cache_service_name }}
  register: service_status
  changed_when: false

- name: Show deployment summary
  debug:
    msg:
      - "Service: {{ dingo_cache_service_name }}"
      - "Status: {{ service_status.stdout }}"
      - "Listen: {{ dingo_cache_listen_ip }}:{{ dingo_cache_listen_port }}"
      - "Config ID: {{ dingo_cache_config_id }}"
      - "Config: {{ dingo_cache_base_dir }}/dingo-cache.conf"
