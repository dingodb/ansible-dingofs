---
# ============================================================
# Role: dingo_cache - Deploy dingo-cache service
# ============================================================

# --- Determine listen IP ---
- name: Detect listen IP from network interface
  shell: ip route | awk '/{{ dingo_cache_ip_pattern }}/ && /src/ { for(i=1;i<=NF;i++) if($i=="src"){print $(i+1); exit}}'
  register: detected_ip
  changed_when: false
  when: dingo_cache_listen_ip is not defined

- name: Set listen IP fact
  set_fact:
    dingo_cache_listen_ip: "{{ dingo_cache_listen_ip | default(detected_ip.stdout | default(ansible_host)) }}"

- name: Validate listen IP
  assert:
    that:
      - dingo_cache_listen_ip | length > 0
    fail_msg: "Could not determine listen IP. Set dingo_cache_listen_ip or dingo_cache_ip_pattern."

# --- Generate UUID for config ID ---
- name: Check for existing config file
  stat:
    path: "{{ dingo_cache_base_dir }}/dingo-cache.conf"
  register: existing_conf

- name: Read existing config ID
  shell: grep '^--id=' "{{ dingo_cache_base_dir }}/dingo-cache.conf" | sed 's/^--id=//'
  register: existing_id
  changed_when: false
  when: existing_conf.stat.exists

- name: Generate UUID for config ID
  command: uuidgen
  register: generated_uuid
  changed_when: false
  when: not existing_conf.stat.exists

- name: Set config ID fact
  set_fact:
    dingo_cache_config_id: "{{ existing_id.stdout | default(generated_uuid.stdout) }}"

# --- NUMA detection (for numactl) ---
- name: Detect NUMA node count
  shell: "numactl --hardware 2>/dev/null | grep -oP 'available: \\d+' | awk '{print $2}'"
  register: numa_node_count_raw
  changed_when: false
  failed_when: false

- name: Set effective NUMA configuration
  set_fact:
    dingo_cache_numa_node_count: "{{ numa_node_count_raw.stdout | default('1') | int }}"
    # Only enable numactl on multi-NUMA machines (makes no sense on single-node and breaks on VMs)
    dingo_cache_numa_enabled: "{{ (numa_node_count_raw.stdout | default('1') | int) > 1 }}"

- name: Log NUMA config
  debug:
    msg: >-
      NUMA nodes: {{ dingo_cache_numa_node_count }},
      numactl: {{ 'enabled (bind to node ' + (dingo_cache_numa_node | default(0) | string) + ')' if dingo_cache_numa_enabled else 'skipped (single NUMA or numactl unavailable)' }}

# --- Detect actual cache mount points (dynamic, per-host) ---
# Always run: auto-discovered mounts take precedence over statically configured values.
# If no mounts found (lvm_cache not yet run), fall back to group_vars / role defaults.
- name: Discover mounted dingo_cache LVM volumes
  shell: mount | grep '{{ lvm_vg_prefix }}_' | awk '{print $3}' | sort -V
  register: discovered_mounts
  changed_when: false
  failed_when: false

- name: Build cache_dirs from discovered mounts (take precedence)
  set_fact:
    _discovered_cache_dirs: "{{ discovered_mounts.stdout_lines | map('regex_replace', '^(.+)$', '\\1/dingofs/dingo-cache') | join(',') }}"

- name: Compute per-disk cache allocation (total capacity × disk_usage_ratio)
  shell: |
    ratio={{ dingo_cache_disk_usage_ratio }}
    echo "=== Per-disk cache capacity (disk_usage_ratio=${ratio}) ==="
    total=0
    idx=0
    for mp in {{ discovered_mounts.stdout_lines | join(' ') }}; do
        # df -BM: Filesystem 1M-blocks Used Available Use% Mounted on
        total_mb=$(df -BM "$mp" 2>/dev/null | awk 'NR==2 {gsub("M","",$2); print $2}')
        disk_cache=$(awk "BEGIN { printf \"%.0f\", ${total_mb} * ${ratio} }")
        echo "  disk[$idx]: $mp  total=${total_mb}MB  cache_alloc=${disk_cache}MB"
        total=$((total + disk_cache))
        idx=$((idx + 1))
    done
    echo "TOTAL_CACHE_MB=$total"
  register: cache_compute
  changed_when: false
  when: discovered_mounts.stdout_lines | length > 0

# Override static config with auto-discovered values (when mounts exist)
- name: Use auto-discovered cache_dirs (overrides static config)
  set_fact:
    dingo_cache_cache_dirs: "{{ _discovered_cache_dirs }}"
  when: _discovered_cache_dirs | length > 0

- name: Extract total cache_size_mb from per-disk compute output
  shell: echo "{{ cache_compute.stdout_lines | select('match', '^TOTAL_CACHE_MB=') | first | regex_replace('^TOTAL_CACHE_MB=', '') }}"
  register: computed_cache_size
  changed_when: false
  when: cache_compute is succeeded and discovered_mounts.stdout_lines | length > 0

- name: Use auto-computed cache_size_mb (per-disk total × disk_usage_ratio)
  set_fact:
    dingo_cache_cache_size_mb: "{{ computed_cache_size.stdout | default('0') | int }}"
  when: discovered_mounts.stdout_lines | length > 0 and computed_cache_size.stdout | default('0') | int > 0

- name: Validate cache_dirs is not empty
  assert:
    that:
      - dingo_cache_cache_dirs.split(',') | length > 0
    fail_msg: >-
      No cache directories configured and no dingo_cache LVM mounts found.
      Run lvm_cache role first (cache_02_lvm.yml) to create /mnt/diskN mount points,
      or set dingo_cache_cache_dirs explicitly in inventory.

- name: Log effective cache_dirs
  debug:
    msg: >-
      Effective cache_dirs ({{ dingo_cache_cache_dirs.split(',') | length }} paths):
      {{ dingo_cache_cache_dirs }}
      (source: {{ 'auto-discovered LVM mounts' if _discovered_cache_dirs | length > 0 else 'static inventory config' }})

- name: Log per-disk capacity allocation
  debug:
    msg: "{{ cache_compute.stdout_lines }}"
  when: cache_compute is succeeded

- name: Log effective cache_size_mb
  debug:
    msg: >-
      Effective cache_size_mb: {{ dingo_cache_cache_size_mb }} MB
      (disk_usage_ratio: {{ dingo_cache_disk_usage_ratio }},
       source: {{ 'auto-computed from disk totals × ratio' if _discovered_cache_dirs | length > 0 else 'static inventory config' }})

# --- Create directories ---
- name: Create dingo-cache base directory
  file:
    path: "{{ dingo_cache_base_dir }}"
    state: directory
    mode: "0755"

- name: Create cache directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ dingo_cache_cache_dirs.split(',') }}"

- name: Create log directory
  file:
    path: "{{ dingo_cache_log_dir }}"
    state: directory
    mode: "0755"

# --- Copy binary from control node ---
- name: Copy dingo-cache binary to remote host
  copy:
    src: "{{ dingo_cache_bin_local_src }}"
    dest: "{{ dingo_cache_base_dir }}/{{ dingo_cache_bin_name }}"
    mode: "0755"

# --- Deploy config and scripts ---
- name: Deploy dingo-cache config file
  template:
    src: dingo-cache.conf.j2
    dest: "{{ dingo_cache_base_dir }}/dingo-cache.conf"
    mode: "0644"
  notify: restart dingo-cache

- name: Deploy dingo-cache startup script
  template:
    src: dingo-cache-start.sh.j2
    dest: "{{ dingo_cache_base_dir }}/dingo-cache-start.sh"
    mode: "0755"
  notify: restart dingo-cache

# --- Deploy systemd service ---
- name: Deploy dingo-cache systemd service
  template:
    src: dingo-cache.service.j2
    dest: "/etc/systemd/system/{{ dingo_cache_service_name }}.service"
    mode: "0644"
  notify: restart dingo-cache

- name: Reload systemd daemon
  systemd:
    daemon_reload: true

- name: Enable and start dingo-cache service
  systemd:
    name: "{{ dingo_cache_service_name }}"
    enabled: true
    state: started

- name: Wait for dingo-cache to be ready
  wait_for:
    port: "{{ dingo_cache_listen_port }}"
    host: "{{ dingo_cache_listen_ip }}"
    delay: 3
    timeout: 60

- name: Display dingo-cache service status
  shell: systemctl is-active {{ dingo_cache_service_name }}
  register: service_status
  changed_when: false

- name: Show deployment summary
  debug:
    msg:
      - "Service: {{ dingo_cache_service_name }}"
      - "Status: {{ service_status.stdout }}"
      - "Listen: {{ dingo_cache_listen_ip }}:{{ dingo_cache_listen_port }}"
      - "Config ID: {{ dingo_cache_config_id }}"
      - "Config: {{ dingo_cache_base_dir }}/dingo-cache.conf"
