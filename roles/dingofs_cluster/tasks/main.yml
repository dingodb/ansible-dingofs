---
# ============================================================
# Role: dingofs_cluster - Deploy DingoFS cluster via dingo CLI
# ============================================================

# --- Ensure base directories exist on all meta_servers ---
#
# The path is the part before the first "${" placeholder, which only yields a
# usable base directory when the placeholders sit at the end:
#     /mnt/data/dingofs-dingo-main/data/${service_role}
#         -> /mnt/data/dingofs-dingo-main/data
#
# When a placeholder is part of the mount name there is no single base
# directory to create -- the path expands per replica -- and the split leaves
# the placeholder in place, so this task would create a literal directory named
# "/mnt/disk${service_replica_sequence}/dingofs-vX.Y/data" on the system disk:
#     /mnt/disk${service_replica_sequence}/dingofs-vX.Y/data/${service_role}
#         -> /mnt/disk${service_replica_sequence}/dingofs-vX.Y/data
#
# Those layouts are covered by lvm_data's lvm_data_subdir, which creates
# <mount>/dingofs-vX.Y for every mount index and chowns it to the service user.
# Skip them here rather than littering the system disk.
- name: Ensure base directories for data, log, and raft exist
  become: true
  file:
    path: "{{ item.1.split('/${')[0] }}"
    state: directory
    owner: "{{ dingofs_user }}"
    group: "{{ dingofs_user }}"
    mode: "0755"
  delegate_to: "{{ item.0 }}"
  loop: "{{ groups['meta_servers'] | product([dingofs_data_dir, dingofs_log_dir, dingofs_raft_dir, dingofs_core_dir, store_mount_volumes]) | list }}"
  when: "'${' not in item.1.split('/${')[0]"

# --- Pull container images on ALL meta_servers ---
- name: Ensure DingoFS container image is present for dingofs user
  become: true
  become_user: "{{ dingofs_user }}"
  shell: |
    if podman image exists {{ dingofs_container_image }}; then
      echo present
    else
      podman pull {{ dingofs_container_image }}
    fi
  args:
    executable: /bin/bash
  register: pull_dingofs
  changed_when: "'present' not in pull_dingofs.stdout"
  delegate_to: "{{ item }}"
  loop: "{{ groups['meta_servers'] }}"

- name: Ensure Dingo Store container image is present for dingofs user
  become: true
  become_user: "{{ dingofs_user }}"
  shell: |
    if podman image exists {{ dingofs_store_image }}; then
      echo present
    else
      podman pull {{ dingofs_store_image }}
    fi
  args:
    executable: /bin/bash
  register: pull_store
  changed_when: "'present' not in pull_store.stdout"
  delegate_to: "{{ item }}"
  loop: "{{ groups['meta_servers'] }}"

- name: Ensure Dingo Executor container image is present for dingofs user
  become: true
  become_user: "{{ dingofs_user }}"
  shell: |
    if podman image exists {{ dingofs_executor_image }}; then
      echo present
    else
      podman pull {{ dingofs_executor_image }}
    fi
  args:
    executable: /bin/bash
  register: pull_executor
  changed_when: "'present' not in pull_executor.stdout"
  delegate_to: "{{ groups['rqlite_master'][0] }}"

# --- Generate config files on admin node ---
- name: Create working directory for cluster configs
  file:
    path: "{{ dingofs_home }}/cluster-config"
    state: directory
    owner: "{{ dingofs_user }}"
    group: "{{ dingofs_user }}"
    mode: "0755"

- name: Generate hosts.yaml for dingo CLI
  template:
    src: dingo-hosts.yaml.j2
    dest: "{{ dingofs_home }}/cluster-config/hosts.yaml"
    owner: "{{ dingofs_user }}"
    group: "{{ dingofs_user }}"
    mode: "0644"

- name: Generate topology.yaml for cluster
  template:
    src: topology.yaml.j2
    dest: "{{ dingofs_home }}/cluster-config/topology-{{ dingofs_cluster_name }}.yaml"
    owner: "{{ dingofs_user }}"
    group: "{{ dingofs_user }}"
    mode: "0644"

# --- Import hosts into dingo ---
- name: Import hosts into dingo CLI
  become: true
  become_user: "{{ dingofs_user }}"
  shell: >
    {{ dingo_cli_bin_dir }}/dingo hosts commit -f {{ dingofs_home }}/cluster-config/hosts.yaml
  args:
    executable: /bin/bash
  register: hosts_commit

- name: Verify hosts imported
  become: true
  become_user: "{{ dingofs_user }}"
  shell: "{{ dingo_cli_bin_dir }}/dingo hosts list"
  args:
    executable: /bin/bash
  register: hosts_list
  changed_when: false

- name: Display imported hosts
  debug:
    var: hosts_list.stdout_lines

# --- Deploy cluster ---
# `dingo cluster add` returns 410009 "cluster already exist" for an existing
# cluster. Treat that as success, otherwise a re-run after a failed deployment
# always stops here and never reaches the deploy step.
- name: Create DingoFS cluster
  become: true
  become_user: "{{ dingofs_user }}"
  shell: >
    {{ dingo_cli_bin_dir }}/dingo cluster add {{ dingofs_cluster_name }}
    -f {{ dingofs_home }}/cluster-config/topology-{{ dingofs_cluster_name }}.yaml
  args:
    executable: /bin/bash
  register: cluster_add
  failed_when: >-
    cluster_add.rc != 0 and
    'already exist' not in (cluster_add.stdout | default(''))
  changed_when: cluster_add.rc == 0

- name: Activate DingoFS cluster
  become: true
  become_user: "{{ dingofs_user }}"
  shell: >
    {{ dingo_cli_bin_dir }}/dingo cluster checkout {{ dingofs_cluster_name }}
  args:
    executable: /bin/bash

- name: Commit topology configuration
  become: true
  become_user: "{{ dingofs_user }}"
  shell: >
    {{ dingo_cli_bin_dir }}/dingo config commit -f {{ dingofs_home }}/cluster-config/topology-{{ dingofs_cluster_name }}.yaml
  args:
    executable: /bin/bash

# `dingo cluster deploy` only works once.
#
# It runs createalltable inside the mds-client container, and that fails once
# the tables exist:
#
#     ✗ createalltable failed: failed to create all metadata tables
#     Error-Code: 650000     (exit code 1)
#
# Unlike `cluster add`, which returns a recognisable "already exist", this is a
# bare exit code with no way to tell "already deployed" from a real failure --
# so it cannot be accepted as success without also swallowing genuine errors.
# Check first instead, and only deploy when there is nothing there.
#
# Counting the service rows, not just grepping for a role name: the header
# ("Role") and the "mds addr :" / "coordinator addr :" summary lines all
# contain role names. Anchoring on the Instances column (n/m) takes only real
# rows -- coordinator x3, store x3, mds x3 (one row per host, 3/3 instances
# each), executor x1.
- name: Check whether the cluster is already deployed
  become: true
  become_user: "{{ dingofs_user }}"
  shell: >
    {{ dingo_cli_bin_dir }}/dingo cluster status 2>/dev/null
    | grep -cE '^ *[^ ]+ +(coordinator|store|mds|executor) +[^ ]+ +[0-9]+/[0-9]+'
  args:
    executable: /bin/bash
  register: cluster_existing
  changed_when: false
  failed_when: false

# The CLI draws an interactive progress spinner even when stdout is not a TTY,
# writing lines of "…" wrapped in ANSI erase codes. Strip them so the recorded
# output is readable. Two sed programs:
#   1. remove ANSI CSI sequences  2. drop lines with no printable ASCII left
#     (which covers both the "…" lines and blank lines)
# pipefail is required: without it the pipeline would report sed's exit status
# and a failed deploy would look like a success.
- name: Deploy DingoFS cluster
  become: true
  become_user: "{{ dingofs_user }}"
  shell: |
    set -o pipefail
    {{ dingo_cli_bin_dir }}/dingo cluster deploy -k --local \
      | sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e '/^[^ -~]*$/d'
  args:
    executable: /bin/bash
  register: deploy_result
  when: cluster_existing.stdout | default('0') | trim == '0'

- name: Report deploy result
  debug:
    msg: >-
      {{ 'cluster deployed' if deploy_result.changed | default(false)
         else 'cluster already deployed (' ~ (cluster_existing.stdout | default('0') | trim)
              ~ ' services) - skipped; `dingo cluster deploy` cannot run twice, so a '
              ~ 'topology change needs the cluster torn down and redeployed' }}

- name: Display deploy output
  debug:
    var: deploy_result.stdout_lines
  when: deploy_result.changed | default(false)

# --- Verify ---
# Same spinner noise as the deploy step; see the comment there.
- name: Check cluster status
  become: true
  become_user: "{{ dingofs_user }}"
  shell: |
    set -o pipefail
    {{ dingo_cli_bin_dir }}/dingo cluster status -sv \
      | sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e '/^[^ -~]*$/d'
  args:
    executable: /bin/bash
  register: cluster_status
  changed_when: false

- name: Display cluster status
  debug:
    var: cluster_status.stdout_lines
