---
- import_role:
    name: version_guard

- import_tasks: validate_image.yml

- name: Read registrations before any first-install mutation
  become: true
  become_user: "{{ dingofs_user }}"
  command: "{{ dingo_cli_bin_dir }}/dingo cluster list"
  register: _install_registrations
  changed_when: false

- name: Determine whether the target is already registered
  set_fact:
    _install_registered: "{{ dingofs_cluster_name in (_install_registrations.stdout | dingo_cluster_list).names }}"

- name: Verify an existing target instead of reinitializing it
  when: _install_registered | bool
  environment:
    DINGO_CLUSTER: "{{ dingofs_cluster_name }}"
    dingo_cluster: "{{ dingofs_cluster_name }}"
  become: true
  become_user: "{{ dingofs_user }}"
  block:
    - name: Read existing target topology
      command: "{{ dingo_cli_bin_dir }}/dingo config show"
      register: _install_topology
      changed_when: false

    - name: Require an unchanged topology
      assert:
        that: (_install_topology.stdout | from_yaml) == (lookup('template', 'topology.yaml.j2') | from_yaml)
        fail_msg: "Target topology differs. Use an explicit configuration update instead of initial deployment."

    - name: Read existing target health
      command: "{{ dingo_cli_bin_dir }}/dingo cluster status -s -v"
      register: _install_health
      changed_when: false

    - name: Refuse reinitialization of an unhealthy registered target
      assert:
        that: (_install_health.stdout | dingo_cluster_status(_install_topology.stdout | from_yaml | dingo_cluster_plan, dingofs_cluster_name)).healthy
        fail_msg: "The registered target is incomplete or unhealthy. Inspect and recover it explicitly; initialization was not retried."

- name: Install a previously absent cluster
  include_tasks: install_new.yml
  when: not (_install_registered | bool)
