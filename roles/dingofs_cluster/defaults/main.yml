---
# --- Cluster shape ----------------------------------------------------------
# dingo-store (the default, unchanged): coordinator + store + mds + executor,
# with local data_dir/raft_dir on every meta server.
# tikv: the MDS keeps its metadata in TiKV (PD address in
# dingofs_mds_storage_url) -- there is no coordinator, store or executor at all
# and no local data_dir/raft_dir. The topology template and the image pulls both
# branch on this. See README "TiKV-backed meta clusters".
dingofs_mds_storage_engine: dingo-store
dingofs_mds_storage_url: ""
# Node that runs the dingo CLI and owns the one-off executor image pull.
# Empty = the historical default, groups['rqlite_master'][0]; a tikv site has no
# rqlite and should name its admin node here instead.
dingofs_control_host: ""

# Container engine CLI for the image pulls. Region configs override it (xn01 is
# the only docker site so far); podman keeps the historical behaviour.
container_engine: podman

# Paths whose base directory must exist before the CLI writes into them. log_dir
# and core_dir apply to both shapes; data_dir/raft_dir/store_mount_volumes only
# exist in the dingo-store shape.
dingofs_dir_list: >-
  {{ [dingofs_log_dir, dingofs_core_dir]
     + ([dingofs_data_dir, dingofs_raft_dir, store_mount_volumes]
        if dingofs_mds_storage_engine | default('dingo-store') != 'tikv' else []) }}

dingofs_cluster_name: v5.1
dingofs_cluster_id: 1
dingofs_container_image: "harbor.zetyun.cn/dingofs/dingofs:v5.1-b484ef2"
dingofs_store_image: "harbor.zetyun.cn/dingodb/dingo-store:90b2885"
dingofs_executor_image: "harbor.zetyun.cn/dingodb/dingo:develop-latest"
dingo_cli_bin_dir: "{{ dingofs_home }}/.dingo/bin"

dingofs_data_dir: "/mnt/data/dingofs-dingo-main/data/${service_role}"
dingofs_log_dir: "/mnt/data/dingofs-dingo-main/logs/${service_role}/${service_replica_sequence}"
dingofs_raft_dir: "/mnt/data/dingofs-dingo-main/raft/${service_role}"
dingofs_core_dir: "/mnt/data/corefiles/core-%e-%p-%t"
dingofs_default_replica_num: 3
dingofs_home_tmp: "/tmp/dingofs-{{ dingofs_cluster_name }}"

coordinator_server_port: 6500
coordinator_raft_port: 7500

store_server_port: 6600
store_raft_port: 7600
store_block_cache_size: 21474836480
store_txn_detail_log: false
store_mount_volumes: "/nas/dingofs/{{ dingofs_cluster_name }}"

mds_base_port: 690
mds_replicas: 3
mds_compact_chunk_enable: true

executor_port: 18765
executor_mysql_port: 13307
executor_java_xms: 256m
executor_java_xmx: 1g
executor_java_soft_max_heap: 512m
executor_java_max_direct_memory: 256m
