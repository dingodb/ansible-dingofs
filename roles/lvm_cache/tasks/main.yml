---
# ============================================================
# Role: lvm_cache - Create LVM from unused NVMe devices
# ============================================================

# --- Pre-flight: the LVM toolchain has to actually work ---
#
# This was `vgs ... | grep -c '{{ lvm_vg_prefix }}' || true`, gating the script
# on "no dingo_cache VG exists yet". Two problems, both fixed here:
#
#   - `|| true` swallowed a failure of `vgs` itself. A broken toolchain gives an
#     empty stdout, `'' | int` is 0, and the guard passed -- the worse the
#     failure, the more likely the disk-claiming script ran. Fail instead.
#
#   - Gating the whole script on that count meant a host whose first run died
#     halfway (VG created, mount never made) was skipped forever, and the play
#     still reported success. The script is idempotent per device -- it skips
#     mounted devices and its own VGs -- so it now always runs, and reports a
#     half-provisioned device itself by exiting non-zero.
- name: Check the LVM toolchain is usable
  command: vgs --noheadings -o vg_name
  register: lvm_vgs
  changed_when: false
  failed_when: false

- name: Refuse to run when the LVM toolchain is broken
  assert:
    that:
      - lvm_vgs.rc == 0
    fail_msg: >-
      `vgs` failed (rc={{ lvm_vgs.rc }}): {{ lvm_vgs.stderr | default('') }}.
      Refusing to run the disk-claiming script with a broken LVM toolchain --
      an empty stdout used to read as "no dingo_cache VGs".
    success_msg: "LVM toolchain is usable"

- name: Display existing {{ lvm_vg_prefix }} volume groups
  debug:
    msg: >-
      Found {{ lvm_vgs.stdout_lines | select('search', lvm_vg_prefix) | list | length }}
      existing {{ lvm_vg_prefix }} volume groups

# --- Deploy and run LVM setup script ---
- name: Deploy LVM setup script
  template:
    src: setup_lvm.sh.j2
    dest: /tmp/setup_lvm_dingo_cache.sh
    mode: "0755"

- name: Run LVM setup script
  shell: /tmp/setup_lvm_dingo_cache.sh
  register: lvm_setup_result
  # No `when` here on purpose -- see the pre-flight comment above.
  #
  # `changed_when` from the script's own output, not the default "the command
  # ran". The script now always runs, so the default would report changed on
  # every play -- on a host where it skipped every device and touched nothing.
  changed_when: >-
    'Successfully set up LVM' in lvm_setup_result.stdout or
    'Aux disk(s) set up' in lvm_setup_result.stdout or
    'Repairing ' in lvm_setup_result.stdout

- name: Display LVM setup output
  debug:
    msg: "{{ lvm_setup_result.stdout_lines }}"
  when: lvm_setup_result is not skipped

- name: Clean up LVM setup script
  file:
    path: /tmp/setup_lvm_dingo_cache.sh
    state: absent

# --- Verify mounts ---
- name: List current {{ lvm_vg_prefix }} volume groups
  shell: vgs --noheadings -o vg_name 2>/dev/null | grep '{{ lvm_vg_prefix }}' || true
  register: final_vg_list
  changed_when: false

- name: Display final VG list
  debug:
    msg: "Active volume groups: {{ final_vg_list.stdout_lines }}"

- name: Verify mount points
  shell: mount | grep '{{ lvm_vg_prefix }}' || true
  register: mount_check
  changed_when: false

- name: Display active mounts
  debug:
    msg: "{{ mount_check.stdout_lines }}"
