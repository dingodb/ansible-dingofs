---
# ============================================================
# Role: dingo_client - Deploy dingo-client (FUSE mount) service
# ============================================================
#
# Every per-instance change is gated on the mountpoint being IDLE. A busy
# mountpoint (host process with open files, another mount namespace holding the
# filesystem, or a container hostPath at/under it) is left COMPLETELY untouched:
# no files, no unit and no stop/start. Other mounts on the same host continue.
#
# The check is done by dingofs_mount_usage_check.sh (deployed once per host in
# main.yml), which never changes anything itself; --dry-run is passed for
# clarity. Its exit code is the contract:
#   0 = IDLE    -> configure this instance
#   1 = BUSY    -> skip this instance, leave the mountpoint alone
#   2 = error   -> fail loudly instead of guessing
- name: Set client report identity for this deployment instance
  set_fact:
    _dingofs_client_report_context:
      operation: deploy
      fsname: "{{ dingo_client_fsname }}"
      mount_point: "{{ dingo_client_mount_point }}"
      service: "{{ dingo_client_service_name }}"

- name: Record the start of this client deployment
  import_tasks: ../../common/tasks/client_report.yml
  vars:
    client_report_stage: precheck
    client_report_status: started
    client_report_reason: checking_mount_usage
    client_report_changed_on_disk: false

- name: "Check whether {{ dingo_client_mount_point }} is in use for {{ dingo_client_fsname }}"
  command: >-
    bash "{{ dingo_client_mount_check_script | default('/root/dingofs/script/check/dingofs_mount_usage_check.sh') }}"
    "{{ dingo_client_mount_point }}" --dry-run
    {{ '--strict' if dingo_client_mount_check_strict | default(false) | bool else '' }}
  register: _mount_usage
  changed_when: false
  failed_when: false
  when: dingo_client_mount_check_enabled | default(true) | bool

- name: Record an unavailable mount usage check
  import_tasks: ../../common/tasks/client_report.yml
  vars:
    client_report_stage: precheck
    client_report_status: "{{ 'dry_run' if ansible_check_mode else 'check_failed' }}"
    client_report_reason: "{{ 'check_mode_not_executed' if ansible_check_mode else 'mount_usage_check_failed' }}"
    client_report_changed_on_disk: false
  when:
    - dingo_client_mount_check_enabled | default(true) | bool
    - (_mount_usage.rc | default(2) | int) not in [0, 1]

- name: "Fail when the mountpoint check cannot run for {{ dingo_client_fsname }}"
  assert:
    that:
      - (_mount_usage.rc | default(2) | int) in [0, 1]
    fail_msg: >-
      The mountpoint usage check failed for {{ dingo_client_mount_point }} on
      {{ inventory_hostname }}
      (rc={{ _mount_usage.rc | default('not run') }}, expected 0=IDLE or 1=BUSY).
      Script: {{ dingo_client_mount_check_script | default('/root/dingofs/script/check/dingofs_mount_usage_check.sh') }}
      stdout: {{ _mount_usage.stdout | default('') }}
      stderr: {{ _mount_usage.stderr | default('') }}
      Refusing to stop or reconfigure the service while its mountpoint state is
      unknown.
  when: dingo_client_mount_check_enabled | default(true) | bool

# Always runs: set_fact persists across loop iterations on the same host, so an
# unconditional reset is what keeps a previous instance's detected unit from
# being "retired" while deploying the next one. A skipped `command` registers
# without stdout_lines, so the empty default yields ''.
- name: "Parse the detected service for {{ dingo_client_fsname }}"
  set_fact:
    _mount_check_service: >-
      {{ (_mount_usage.stdout_lines | default([]))
         | select('search', 'Detected service:')
         | map('regex_replace', '^.*Detected service: *', '')
         | map('regex_replace', '\\.service$', '')
         | map('trim') | list | first | default('') }}

- name: Record this busy instance as unchanged
  import_tasks: ../../common/tasks/client_report.yml
  vars:
    client_report_stage: precheck
    client_report_status: skipped_busy_before_change
    client_report_reason: mount_in_use
    client_report_changed_on_disk: false
  when:
    - dingo_client_mount_check_enabled | default(true) | bool
    - (_mount_usage.rc | default(-1) | int) == 1

- name: "Skip {{ dingo_client_fsname }} because {{ dingo_client_mount_point }} is in use"
  debug:
    msg: >-
      SKIPPING {{ dingo_client_fsname }} on {{ inventory_hostname }}:
      {{ dingo_client_mount_point }} is in use, so nothing was changed for this
      mountpoint. Drain/delete the users above and re-run. Other mountpoints on
      this host continue.
      {{ _mount_usage.stdout_lines | default([]) | select('search', 'IN USE|BUSY') | list | join(' | ') }}
  when:
    - dingo_client_mount_check_enabled | default(true) | bool
    - (_mount_usage.rc | default(1) | int) != 0

- name: "Configure {{ dingo_client_fsname }} (mountpoint idle)"
  include_tasks: instance_configure.yml
  when: >-
    not (dingo_client_mount_check_enabled | default(true) | bool)
    or (_mount_usage.rc | default(-1) | int) == 0
