---
dingo_client_fsname: alayanew
dingo_client_base_dir: "/root/dingofs/dingo-client/{{ dingo_client_fsname }}"
dingo_client_bin_local_src: /root/dingofs/pkg/dingo-client
dingo_client_dingo_bin_local_src: "{{ dingo_cli_latest_pkg_path | default('/root/dingofs/pkg/dingo-latest') }}"
dingo_client_mount_point: /dingofs/data
dingo_client_port: 12000

dingo_client_mds_addrs: ""
dingo_client_cache_group: dingofs-group

# Fallbacks for when the value is not in inventory. Separate names because the
# deploy loop shadows dingo_client_mds_addrs / dingo_client_cache_group inside a
# vars: block -- so these must be literals: referencing the originals from here
# resolves back to the shadowing var and recurses until the stack blows.
# Keep them in step with the two values above.
dingo_client_mds_addrs_default: ""
dingo_client_cache_group_default: dingofs-group
# Appended to every loop-built service_name / base_dir / log_dir, e.g. "-v5.2"
# gives dingofs-mount-<fs>-v5.2. Empty (default) = unversioned names.
# NOTE: the deploy loop does NOT read same-named group_vars templates for
# service_name / base_dir / log_dir (their {{ dingo_client_fsname }} arrives
# RAW from hostvars and Ansible never re-renders carried-forward braces) —
# version them ONLY via this suffix, or per-instance service_name:/log_dir:/
# base_dir: keys on the dingo_clients entry.
dingo_client_version_suffix: ""
dingo_client_log_dir: "/mnt/disk1/dingofs/logs/{{ dingo_client_fsname }}"
dingo_client_log_level: ERROR
dingo_client_log_v: 0
dingo_client_ld_preload: /usr/local/lib/libjemalloc.so.2

# One shared switch controls Cache and Client IB locality. With RDMA enabled,
# require a known IB node and keep CPU and memory-policy targets on that node.
dingofs_numa_require_ib: true

# --- NUMA binding (numactl, prepended to the client start line) ---
# Apply the process policy before initialization, complementing any explicit
# per-buffer allocation policies in the binary. When a node is known:
#   numactl --cpunodebind=<node> --preferred=<node>
# Required locality always uses the IB node, even when per-core pinning is off.
# Otherwise follow the final cpuset node or dingo_client_numactl_node; with
# pinning off and no explicit node, leave the process unbound. Overrides must
# agree with IB while dingofs_numa_require_ib=true.
dingo_client_numactl_enabled: true
dingo_client_numactl_node: ""
# true = --membind=<node>: strict, allocation FAILS if the node is
#                  exhausted (the client then crash-loops under Restart=always).
# false (default) = --preferred=<node>: prefer local memory, allow spill.
dingo_client_numactl_membind: false

# --- CPU pinning (v5.2+: --shards/--pin_cpu/--cpuset; same rules as dingo_cache) ---
dingo_client_shards: 8
dingo_client_pin_cpu: true
# Manual override: a range ("100-115") or an explicit CPU list
# ("37,39,43,46-49,53" — e.g. the least-busy CPUs from a cpuset-check.sh
# fallback suggest). Empty (default) = auto-detect per host at
# deploy time: SHARDS free whole cores on the IB NUMA node. Cross-node fallback
# is only allowed when dingofs_numa_require_ib=false. Overlap with claimed CPUs
# follows dingo_client_cpuset_on_insufficient (fail stops, warn drops the list
# to auto-detect, force pins it anyway); offline CPUs always fail.
# Per-instance override via `cpuset:` on a dingo_clients entry (needed when
# mounts must differ); validated the same way when set.
dingo_client_cpuset: ""
# PREFERRED node for the auto-detected cpuset. Empty (default) = AUTO, decided
# once per host: the NUMA node of dingo_client_rdma_device, unless that node is
# hotter than dingo_client_ib_node_mem_max_pct — then the coolest node under
# the threshold when IB locality is disabled. Overrides must match the IB node
# while dingofs_numa_require_ib=true.
dingo_client_cpuset_numa_node: ""
# With required IB locality this is an alert threshold, not a migration trigger.
# When locality is disabled, retain the memory-aware preferred-node fallback.
dingo_client_ib_node_mem_max_pct: 80
dingo_client_cpuset_busy_pct: 30
# fail|warn|force when a node cannot offer <shards> free whole cores — and when
# a manual cpuset: overlaps claimed CPUs.
# fail = stop the deploy. warn = keep going WITHOUT --cpuset (unpinned);
# an overlapping manual list is dropped back to auto-detect instead.
# force = pin onto OCCUPIED CPUs anyway (least-busy pick by sampled usage,
# fully-shared boxes; shards will contend until CPUs are freed.
dingo_client_cpuset_on_insufficient: force
# true = cpuset expands to all sibling threads of the chosen cores (e.g. 8
# cores -> 16 ids like 100-115 on adjacent-pair HT layouts); false (default) =
# first-thread ids only, one shard per physical core, no hyperthread sharing.
dingo_client_cpuset_include_siblings: false

# --- Per-host tuning profile, selected from total memory -------------------
# tasks/main.yml reads /proc/meminfo once per host:
#   <  dingo_client_mem_threshold_gb  -> "small"
#   >= dingo_client_mem_threshold_gb  -> "large"
# and exports dingo_client_tuning_profile_effective for the mount script.
# Force one profile with dingo_client_tuning_profile: small|large (an
# unrecognised value behaves like auto). Any single value below can still be
# overridden from group_vars/host_vars, which beats these role defaults.
dingo_client_mem_threshold_gb: 256
dingo_client_tuning_profile: auto
dingo_client_mem_profiles:
  small:
    vfs_read_buffer_total_mb: 256
    vfs_write_buffer_total_mb: 256
    vfs_compact_buffer_total_mb: 128
    fuse_max_threads: 64
    buffer_pool_mb: 4
    rdma_max_inflight_rpcs: 128
    rdma_max_connections: 64
  large:
    vfs_read_buffer_total_mb: 4096
    vfs_write_buffer_total_mb: 4096
    vfs_compact_buffer_total_mb: 512
    fuse_max_threads: 512
    buffer_pool_mb: 1024
    rdma_max_inflight_rpcs: 256
    rdma_max_connections: 128

# --- RDMA (v5.2+: --use_rdma/--cache_rdma_device/--cache_rdma_port_num/--buffer_pool_mb/--rdma_max_inflight_rpcs/--rdma_max_connections) ---
dingo_client_use_rdma: true
# Empty/auto = discover per host from IB_IP_PREFIX. Set a name only to
# override discovery on a host whose interface-to-device mapping is unusual.
dingo_client_rdma_device: ""
dingo_client_rdma_port_num: 1
dingo_client_buffer_pool_mb: "{{ dingo_client_mem_profiles[dingo_client_tuning_profile_effective | default('small')].buffer_pool_mb }}"
dingo_client_rdma_max_inflight_rpcs: "{{ dingo_client_mem_profiles[dingo_client_tuning_profile_effective | default('small')].rdma_max_inflight_rpcs }}"
dingo_client_rdma_max_connections: "{{ dingo_client_mem_profiles[dingo_client_tuning_profile_effective | default('small')].rdma_max_connections }}"

# FUSE / VFS tuning
dingo_client_cache_store: none
dingo_client_vfs_read_executor_thread: 32
dingo_client_vfs_read_buffer_total_mb: "{{ dingo_client_mem_profiles[dingo_client_tuning_profile_effective | default('small')].vfs_read_buffer_total_mb }}"
dingo_client_vfs_write_buffer_total_mb: "{{ dingo_client_mem_profiles[dingo_client_tuning_profile_effective | default('small')].vfs_write_buffer_total_mb }}"
dingo_client_vfs_compact_buffer_total_mb: "{{ dingo_client_mem_profiles[dingo_client_tuning_profile_effective | default('small')].vfs_compact_buffer_total_mb }}"
dingo_client_vfs_prefetch_blocks: 0
dingo_client_fuse_max_threads: "{{ dingo_client_mem_profiles[dingo_client_tuning_profile_effective | default('small')].fuse_max_threads }}"
dingo_client_fuse_enable_readdir_cache: "false"
dingo_client_fuse_attr_cache_timeout_s: 10
dingo_client_fuse_entry_cache_timeout_s: 10

dingo_client_service_name: "dingofs-mount-{{ dingo_client_fsname }}"

# Whether to skip the "is this mountpoint busy?" check before restarting.
# false (default) = run `fuser -m` first; if anything is using the mountpoint,
#                   skip the restart and warn. Safe.
# true            = restart unconditionally, interrupting whatever is reading or
#                   writing the mountpoint. Use with care.
dingo_client_force_restart: false

# --- InfiniBand network readiness (systemd ExecStartPre) ---
# Configure these globally in inventory/group_vars/all.yml; these values are
# standalone-role fallbacks. The check script auto-detects every RDMA device,
# so no per-host HCA/IPoIB name is needed.
IB_CHECK_ENABLED: true
IB_CHECK_SCRIPT: /root/dingofs/script/check/check-ib-ready.sh
IB_IP_PREFIX: "192.168."
IB_WAIT_TIMEOUT: 60

# --- Mountpoint usage check (before stopping/reconfiguring an instance) ---
# When a mountpoint is in use (host process, another mount namespace, or a
# container hostPath), that instance is skipped entirely. Deployed once per
# host; see roles/common/files/dingofs_mount_usage_check.sh.
dingo_client_mount_check_enabled: true
# Default: only cci* Kubernetes containers; host process checks still apply.
# Opt in to all containers and other process mount namespaces with true.
dingo_client_mount_check_strict: false
dingo_client_mount_check_script: /root/dingofs/script/check/dingofs_mount_usage_check.sh

# Normal OOM eligibility avoids making a large FUSE process unkillable.
# Sites may tune this explicitly; -1000 disables OOM killing entirely.
dingo_client_oom_score_adjust: 0

# Optional per-mount systemd ceilings; empty values leave systemd defaults.
dingo_client_cpu_quota: ""
dingo_client_memory_high: ""
dingo_client_memory_max: ""
# Emit these flags only when selected by a site, retaining other sites' flags.
dingo_client_poll_mode: ""
dingo_client_vfs_bthread_worker_num: ""
