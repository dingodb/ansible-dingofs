---
# Playbook: Deploy dingo-cache service on cache nodes
# Idempotent initial deployment and updates of binaries/config/service files.
# Unchanged current services are not restarted; interrupted restarts are retried.
- name: Deploy dingo-cache service
  hosts: cache_servers
  remote_user: root
  become: false
  vars_files:
    - ../roles/dingo_cache/vars/rollout.yml
  serial: "{{ _cache_deploy_batch | dingo_cache_batch_sizes }}"
  pre_tasks:
    - import_tasks: ../roles/dingo_cache/tasks/rollout_batch.yml
      tags: [cache_rollout_preflight]
  roles:
    - dingo_cache
