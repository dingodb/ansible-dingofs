---
# Playbook: Check dingo-cache service status
- name: Check dingo-cache status
  hosts: cache_servers
  remote_user: root
  become: false
  gather_facts: false
  tasks:
    - name: Check dingo-cache service status
      systemd:
        name: "{{ dingo_cache_service_name }}"
      register: service_info

    - name: Display service status
      debug:
        msg: "{{ inventory_hostname }}: {{ dingo_cache_service_name }} is {{ service_info.status.ActiveState }}"

    # Listen IP lives in the deployed conf (e.g. a storage/IB NIC address),
    # which is NOT necessarily the ansible_host management NIC. Probe the
    # address the service actually bound to.
    - name: Read listen IP from dingo-cache conf
      shell: >-
        grep '^--listen_ip=' {{ dingo_cache_base_dir }}/dingo-cache.conf 2>/dev/null
        | sed 's/^--listen_ip=//' || true
      register: listen_ip_conf
      changed_when: false

    - name: Check dingo-cache listen port
      wait_for:
        port: "{{ dingo_cache_listen_port }}"
        host: "{{ listen_ip_conf.stdout | default('127.0.0.1') }}"
        timeout: 5
      register: port_check
      ignore_errors: true

    - name: Display port status
      debug:
        msg: "{{ inventory_hostname }}: port {{ dingo_cache_listen_port }} is {{ 'open' if port_check is success else 'closed' }}"

    - name: Show LVM volume groups
      shell: vgs --noheadings -o vg_name,vg_size 2>/dev/null | grep '{{ lvm_vg_prefix }}' || echo 'No dingo_cache VGs found'
      register: vg_info
      changed_when: false

    - name: Display VG info
      debug:
        msg: "{{ vg_info.stdout_lines }}"

    - name: Show mount points
      shell: df -h | grep '{{ lvm_vg_prefix }}' || echo 'No dingo_cache mounts found'
      register: mount_info
      changed_when: false

    - name: Display mount info
      debug:
        msg: "{{ mount_info.stdout_lines }}"
