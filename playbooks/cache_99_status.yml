---
# Playbook: Check dingo-cache service status
- name: Check dingo-cache status
  hosts: cache_servers
  remote_user: root
  become: false
  gather_facts: false
  tasks:
    - name: Check dingo-cache service status
      systemd:
        name: "{{ dingo_cache_service_name }}"
      register: service_info

    - name: Display service status
      debug:
        msg: "{{ inventory_hostname }}: {{ dingo_cache_service_name }} is {{ service_info.status.ActiveState }}"

    # Listen IP lives in the deployed conf (e.g. a storage/IB NIC address),
    # which is NOT necessarily the ansible_host management NIC. Probe the
    # address the service actually bound to.
    - name: Read listen IP from dingo-cache conf
      shell: >-
        grep '^--listen_ip=' {{ dingo_cache_base_dir }}/dingo-cache.conf 2>/dev/null
        | sed 's/^--listen_ip=//' || true
      register: listen_ip_conf
      changed_when: false

    - name: Check dingo-cache listen port
      wait_for:
        port: "{{ dingo_cache_listen_port }}"
        host: "{{ listen_ip_conf.stdout | default('127.0.0.1') }}"
        timeout: 5
      register: port_check
      ignore_errors: true

    - name: Display port status
      debug:
        msg: "{{ inventory_hostname }}: port {{ dingo_cache_listen_port }} is {{ 'open' if port_check is success else 'closed' }}"

    # Which disks hold cache data depends on how they were discovered: a
    # dingo_cache_* LVM volume group, or mounts under dingo_cache_data_prefix /
    # dingo_cache_log_prefix (plus the deprecated dingo_cache_mount_prefix
    # fallback) on hosts that share their disks with another role. Report
    # whichever applies. The previous version only looked for the VGs and printed
    # "not found" for the prefix case, which reads like a problem when it is the
    # expected layout.
    - name: Show cache disks
      shell: |
        {% set _data_p = dingo_cache_data_prefix | default(dingo_cache_mount_prefix | default('')) %}
        {% set _log_p = dingo_cache_log_prefix | default(dingo_cache_mount_prefix | default('')) %}
        {% if _data_p | length > 0 or _log_p | length > 0 %}
        {% if _data_p | length > 0 %}
        df -hT {{ _data_p }}* 2>/dev/null || echo 'No mounts under {{ _data_p }}'
        {% endif %}
        {% if _log_p | length > 0 and _log_p != _data_p %}
        df -hT {{ _log_p }}* 2>/dev/null || echo 'No mounts under {{ _log_p }}'
        {% endif %}
        {% else %}
        vgs --noheadings -o vg_name,vg_size 2>/dev/null | grep '{{ lvm_vg_prefix }}' || echo 'No dingo_cache VGs found'
        df -h | grep '{{ lvm_vg_prefix }}' || true
        {% endif %}
      register: cache_disks
      changed_when: false

    - name: Display cache disks
      debug:
        msg: "{{ cache_disks.stdout_lines }}"
