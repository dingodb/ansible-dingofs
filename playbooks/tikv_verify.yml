---
# ============================================================
# Playbook: TiKV pre-flight for a TiKV-backed DingoFS meta cluster
# ============================================================
# A v5.2 MDS with `mds_storage_engine: tikv` keeps its metadata in TiKV, so a
# healthy TiKV cluster is a hard prerequisite of the meta deployment. This
# playbook only READS -- it never starts, stops, deploys, upgrades or
# reconfigures anything, so it is safe to run before every meta deploy and
# against a live cluster.
#
# Run it against the site's meta inventory (on the host that has tiup, usually
# the first meta server):
#
#   ansible-playbook -i <region>/hosts-meta.yml playbooks/tikv_verify.yml
#
# Overrides:
#   -e tikv_cluster_name=dingofs-tikv     # tiup cluster name
#   -e tikv_min_stores=18                 # expected TiKV store count
#   -e tikv_pd_addr=192.168.0.16:2379     # PD endpoint (default: this host:2379)
#   -e tikv_verify_hosts=meta_servers     # inventory group to run on
#
# Sites whose MDS keeps metadata in dingo-store or rqlite do not need this.
# The TiKV cluster itself is deployed and upgraded with tiup, deliberately not
# by ansible (tiup owns the cluster state machine).

- name: TiKV pre-flight
  hosts: "{{ tikv_verify_hosts | default('meta_servers') }}"
  gather_facts: false

  vars:
    tikv_cluster_name: dingofs-tikv
    tikv_min_stores: 3

  tasks:
    # --- locate tiup ---------------------------------------------------------
    - name: Locate the tiup binary
      shell: command -v tiup || ls -1 ~/.tiup/bin/tiup
      register: _tiup_bin
      changed_when: false
      failed_when: false
      run_once: true

    - name: Fail when tiup is not installed on this host
      assert:
        that:
          - _tiup_bin.rc == 0
          - (_tiup_bin.stdout | trim) | length > 0
        fail_msg: >-
          tiup not found on {{ inventory_hostname }}. Install it on the TiKV
          deploy node first
          (curl --proto '=https' --tlsv1.2 -sSf https://tiup-mirrors.pingcap.com/install.sh | sh),
          or point the play at the host that has it with
          -e tikv_verify_hosts=<group-or-host>.
      run_once: true

    - name: Remember the tiup path
      set_fact:
        _tiup: "{{ _tiup_bin.stdout | trim }}"
      run_once: true

    # --- the cluster exists --------------------------------------------------
    - name: List the tiup clusters
      command: "{{ _tiup }} cluster list"
      register: _tiup_list
      changed_when: false
      run_once: true

    - name: Fail when the TiKV cluster is not registered with tiup
      assert:
        that:
          - tikv_cluster_name in _tiup_list.stdout
        fail_msg: >-
          tiup on {{ inventory_hostname }} has no cluster named
          "{{ tikv_cluster_name }}". Nothing to verify -- deploy it first
          (tiup cluster deploy), or set -e tikv_cluster_name=<name>.
          Known clusters:
          {{ _tiup_list.stdout }}
      run_once: true

    # --- every component is Up ----------------------------------------------
    - name: Display the cluster
      command: "{{ _tiup }} cluster display {{ tikv_cluster_name }}"
      register: _tiup_display
      changed_when: false
      run_once: true

    - name: Fail when any TiKV component is not Up
      assert:
        that:
          - "'Down' not in _tiup_display.stdout"
          - "'Tombstone' not in _tiup_display.stdout"
          - "'Offline' not in _tiup_display.stdout"
          - "'N/A' not in _tiup_display.stdout"
        fail_msg: >-
          Some TiKV components are not Up -- fix the TiKV cluster before
          deploying a TiKV-backed MDS. Full display output:
          {{ _tiup_display.stdout }}
      run_once: true

    # --- PD says every store is Up ------------------------------------------
    # PD runs on every meta node in the reference layout, so the play's own
    # host answers on 2379; override tikv_pd_addr for other layouts.
    - name: Read store status from PD (read-only)
      uri:
        url: "http://{{ tikv_pd_addr | default(ansible_host ~ ':2379') }}/pd/api/v1/stores"
        return_content: true
        timeout: 10
      register: _pd_stores
      changed_when: false
      run_once: true

    - name: Fail when PD reports too few or unhealthy stores
      vars:
        _stores: "{{ (_pd_stores.content | from_json).stores }}"
        _not_up: "{{ _stores | map(attribute='store.state_name') | reject('eq', 'Up') | list }}"
      assert:
        that:
          - (_stores | length) >= (tikv_min_stores | int)
          - _not_up | length == 0
        fail_msg: >-
          PD reports {{ _stores | length }} store(s), expected at least
          {{ tikv_min_stores }}; not-Up: {{ _not_up | default([]) }}.
          A TiKV-backed MDS cannot be deployed until every store is Up.
      run_once: true

    # --- what the operator needs for the MDS topology -----------------------
    #
    # Everything is computed in `vars` on purpose: an expression written inline
    # in the literal msg block keeps its backslash escapes verbatim, so a
    # regex_replace there silently matches nothing and prints the raw
    # `tiup cluster display` rows instead of the field it was asked for
    # (measured 2026-10-13). `split` avoids escapes altogether and works in
    # either position, so the field extraction uses that.
    - name: TiKV pre-flight summary
      vars:
        _stores: "{{ (_pd_stores.content | from_json).stores }}"
        # component rows look like: <id> <role> <host> <ports> <os/arch> <status> ...
        # column 2 is the role, column 1 the id (e.g. 192.168.0.16:2379 for a PD).
        _comp_lines: "{{ _tiup_display.stdout_lines | select('search', 'linux/') | list }}"
        _roles: "{{ _comp_lines | map('split') | map(attribute=1) | list | unique | sort }}"
        _pd_addrs: "{{ _comp_lines | map('split') | selectattr('1', 'eq', 'pd') | map('first') | list }}"
        _version: "{{ (_tiup_display.stdout_lines | select('match', '^Cluster version:') | list | first | default('Cluster version: ?')).split(':')[1] | trim }}"
      debug:
        msg: |
          TiKV cluster : {{ tikv_cluster_name }}  ({{ _version }})

          Components   : {{ _comp_lines | length }} 个，全部 Up（上文已断言无 Down/Tombstone/Offline/N-A）
                         角色：{{ _roles | join('  ') }}
          Stores       : {{ _stores | length }} 个 Up（下限 {{ tikv_min_stores }}）
          PD endpoints : {{ _pd_addrs | join('  ') }}

          ↓ 照抄进区配置的 group_vars（dingofs_cluster 会渲染进 MDS 拓扑）：
            dingofs_mds_storage_engine: tikv
            dingofs_mds_storage_url: "list://{{ _pd_addrs | join(',') }}"
      run_once: true
