---
# Existing hosts: stage the manually prepared server CLI, preserving config.
- name: Validate and stage the compatible server Dingo CLI executable
  hosts: admin
  gather_facts: false
  become: true
  any_errors_fatal: true
  roles:
    - role: dingo_cli
      vars:
        dingo_cli_update_existing: true
      when: not ansible_check_mode
  tasks:
    - name: Explain shared CLI update check mode
      debug:
        msg: "Check mode: server CLI staging skipped. Prepare the compatible binary at dingo_cli_pkg_path on the controller; run without --check to validate and stage it. No server CLI URL is downloaded."
      when: ansible_check_mode
