---
# Playbook: Check dingo-client service status
- name: Check dingo-client status
  hosts: client_servers
  remote_user: root
  become: false
  gather_facts: false
  tasks:
    - name: Validate and select dingo-client instances for this play
      vars:
        _play_clients: "{{ dingo_clients if (dingo_clients is defined and 'dingo_clients' not in hostvars[inventory_hostname]) else none }}"
        _default_client: >-
          {{ {'fsname': dingo_client_fsname, 'mount_point': dingo_client_mount_point}
             if (dingo_client_fsname is defined and dingo_client_mount_point is defined)
             else none }}
        _host_clients: "{{ dingo_clients if dingo_clients is defined else ([_default_client] if _default_client is not none else []) }}"
      set_fact:
        _dingo_clients_play_plan: >-
          {{ ansible_play_hosts_all | dingo_client_validate_play(
               hostvars,
               only=dingo_client_only | default(''),
               include_disabled=false,
               play_clients=_play_clients,
               default_client=_default_client,
               default_version_suffix=dingo_client_version_suffix | default('')) }}
        _dingo_clients_selection: >-
          {{ _host_clients | dingo_client_select(
               only=dingo_client_only | default(''),
               version_suffix=dingo_client_version_suffix | default(''),
               include_disabled=false) }}

    - name: Fail if dingo_client_only matches no enabled client in this play
      assert:
        that:
          - _dingo_clients_play_plan.valid | bool
        fail_msg: "{{ _dingo_clients_play_plan.error }}"

    - name: Set effective client status target list for this host
      set_fact:
        _dingo_clients_selected: "{{ _dingo_clients_selection.selected }}"
        _dingo_clients_has_targets: "{{ (_dingo_clients_selection.selected | length) > 0 }}"

    - name: Report disabled client instances skipped by selection on this host
      debug:
        msg: >-
          SKIP disabled dingo-client instance(s) on {{ inventory_hostname }} (enabled: false):
          {{ _dingo_clients_selection.skipped_disabled | map(attribute='fsname') | list | join(', ') }}
      when: _dingo_clients_selection.skipped_disabled | length > 0

    - name: Report host skipped with no selected dingo-client instances
      debug:
        msg: >-
          SKIP {{ inventory_hostname }}: no dingo-client instances selected
          {%- if _dingo_clients_selection.selectors | length > 0 %}
           for dingo_client_only={{ _dingo_clients_selection.selectors | join(',') }}
          {%- endif %}
          {%- if _dingo_clients_selection.disabled | length > 0 %}
           (disabled: {{ _dingo_clients_selection.disabled | map(attribute='fsname') | list | join(', ') }})
          {%- endif %}.
      when: not (_dingo_clients_has_targets | bool)

    - name: Check dingo-client service status
      systemd:
        name: "{{ item.service_name | default('dingofs-mount-' ~ item.fsname ~ (dingo_client_version_suffix | default(''))) }}"
      register: service_info
      loop: "{{ _dingo_clients_selected }}"
      loop_control:
        label: "{{ item.fsname }}"

    - name: Terminate if service is inactive
      fail:
        msg: "{{ inventory_hostname }}: {{ item.service_name | default('dingofs-mount-' ~ item.fsname ~ (dingo_client_version_suffix | default(''))) }} is {{ service_info.results[my_idx].status.ActiveState | default('unknown') }}"
      when: (service_info.results[my_idx].status.ActiveState | default('unknown')) != 'active'
      loop: "{{ _dingo_clients_selected }}"
      loop_control:
        label: "{{ item.fsname }}"
        index_var: my_idx

    - name: Display active service status
      debug:
        msg: "{{ inventory_hostname }}: {{ item.service_name | default('dingofs-mount-' ~ item.fsname ~ (dingo_client_version_suffix | default(''))) }} is active"
      loop: "{{ _dingo_clients_selected }}"
      loop_control:
        label: "{{ item.fsname }}"

    - name: Check mount point
      command: mountpoint -q {{ item.mount_point }}
      register: mount_check
      changed_when: false
      failed_when: false
      loop: "{{ _dingo_clients_selected }}"
      loop_control:
        label: "{{ item.mount_point }}"

    - name: Display mount status
      debug:
        msg: "{{ inventory_hostname }}: {{ item.item.mount_point }} is {{ 'mounted' if item.rc == 0 else 'NOT mounted' }}"
      loop: "{{ mount_check.results }}"
      loop_control:
        label: "{{ item.item.mount_point }}"

    - name: Show mount details
      shell: df -h {{ item.mount_point }} 2>/dev/null || echo 'Not mounted'
      register: df_info
      changed_when: false
      loop: "{{ _dingo_clients_selected }}"
      loop_control:
        label: "{{ item.mount_point }}"

    - name: Display mount details
      debug:
        msg: "{{ inventory_hostname }} [{{ item.item.fsname }}]: {{ item.stdout_lines }}"
      loop: "{{ df_info.results }}"
      loop_control:
        label: "{{ item.item.mount_point }}"

    - name: Require every client mount to be present
      assert:
        that: item.rc == 0
        fail_msg: "{{ item.item.mount_point }} is not mounted"
      loop: "{{ mount_check.results }}"

    - name: Read filesystem identity for each mount
      command:
        argv: [findmnt, -J, -o, 'FSTYPE,SOURCE', --mountpoint, "{{ item.mount_point }}"]
      loop: "{{ _dingo_clients_selected }}"
      register: _client_mount_types
      changed_when: false
      failed_when: false

    - name: Require the intended DingoFS filesystem at each mount
      vars:
        _mounted: "{{ item.stdout | from_json }}"
      assert:
        that:
          - item.rc == 0
          - _mounted.filesystems | length == 1
          - _mounted.filesystems[0].fstype is match('^fuse([.]|$)')
          - _mounted.filesystems[0].source == 'DingoFS:' ~ item.item.fsname
        fail_msg: "{{ item.item.mount_point }} does not contain the intended DingoFS filesystem."
      loop: "{{ _client_mount_types.results }}"
